name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        ghc-version: ['9.8.1', '9.6.3', '9.4.8']
        cabal-version: ['3.10.1.0']
        os: [ubuntu-latest, ubuntu-22.04, ubuntu-20.04, macos-latest, macos-13, macos-12]
        exclude:
          # Exclude older GHC versions on newer OS
          - os: macos-13
            ghc-version: '9.4.8'
          - os: macos-latest
            ghc-version: '9.4.8'
          - os: ubuntu-latest
            ghc-version: '9.4.8'

    steps:
    - uses: actions/checkout@v4

    - name: Set up GHC ${{ matrix.ghc-version }}
      uses: haskell/actions/setup@v2
      with:
        ghc-version: ${{ matrix.ghc-version }}
        cabal-version: ${{ matrix.cabal-version }}

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cabal/packages
          ~/.cabal/store
          dist-newstyle
        key: ${{ runner.os }}-${{ matrix.ghc-version }}-${{ hashFiles('**/*.cabal', 'cabal.project') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.ghc-version }}-

    - name: Build with warnings
      run: |
        cabal update
        cabal build --enable-tests --ghc-options="-Wall -Werror -Wcompat -Widentities -Wincomplete-record-updates -Wincomplete-uni-patterns -Wmissing-export-lists -Wmissing-home-modules -Wpartial-fields -Wredundant-constraints -Wunused-packages -Wunused-type-patterns"

    - name: Run tests
      run: |
        cabal test --test-show-details=always

    - name: Check formatting
      run: |
        cabal run fourmolu -- --mode check $(find . -name "*.hs" -not -path "./dist-newstyle/*")

  docs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up GHC
      uses: haskell/actions/setup@v2
      with:
        ghc-version: '9.8.1'
        cabal-version: '3.10.1.0'

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cabal/packages
          ~/.cabal/store
          dist-newstyle
        key: ${{ runner.os }}-ghc-9.8.1-${{ hashFiles('**/*.cabal', 'cabal.project') }}
        restore-keys: |
          ${{ runner.os }}-ghc-9.8.1-

    - name: Build with Haddock
      run: |
        cabal update
        cabal haddock --haddock-all --haddock-internal --haddock-html --haddock-hyperlink-source

    - name: Upload Haddock docs
      uses: actions/upload-artifact@v4
      with:
        name: haddock-docs
        path: dist-newstyle/build/*/*/*/bsc-*/doc/html/bsc/

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up GHC
      uses: haskell/actions/setup@v2
      with:
        ghc-version: '9.8.1'
        cabal-version: '3.10.1.0'

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cabal/packages
          ~/.cabal/store
          dist-newstyle
        key: ${{ runner.os }}-ghc-9.8.1-${{ hashFiles('**/*.cabal', 'cabal.project') }}
        restore-keys: |
          ${{ runner.os }}-ghc-9.8.1-

    - name: Install HLint
      run: |
        cabal update
        cabal install hlint

    - name: Run HLint
      run: |
        hlint .

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up GHC
      uses: haskell/actions/setup@v2
      with:
        ghc-version: '9.8.1'
        cabal-version: '3.10.1.0'

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cabal/packages
          ~/.cabal/store
          dist-newstyle
        key: ${{ runner.os }}-ghc-9.8.1-${{ hashFiles('**/*.cabal', 'cabal.project') }}
        restore-keys: |
          ${{ runner.os }}-ghc-9.8.1-

    - name: Install dependencies
      run: |
        cabal update
        cabal install --only-dependencies

    - name: Run security audit
      run: |
        cabal audit

  dependencies:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up GHC
      uses: haskell/actions/setup@v2
      with:
        ghc-version: '9.8.1'
        cabal-version: '3.10.1.0'

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cabal/packages
          ~/.cabal/store
          dist-newstyle
        key: ${{ runner.os }}-ghc-9.8.1-${{ hashFiles('**/*.cabal', 'cabal.project') }}
        restore-keys: |
          ${{ runner.os }}-ghc-9.8.1-

    - name: Check for outdated dependencies
      run: |
        cabal outdated

    - name: Check for unused dependencies
      run: |
        cabal unused

  coverage:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up GHC
      uses: haskell/actions/setup@v2
      with:
        ghc-version: '9.8.1'
        cabal-version: '3.10.1.0'

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cabal/packages
          ~/.cabal/store
          dist-newstyle
        key: ${{ runner.os }}-ghc-9.8.1-${{ hashFiles('**/*.cabal', 'cabal.project') }}
        restore-keys: |
          ${{ runner.os }}-ghc-9.8.1-

    - name: Install hpc
      run: |
        cabal install hpc

    - name: Build with coverage
      run: |
        cabal update
        cabal build --enable-tests --enable-coverage

    - name: Run tests with coverage
      run: |
        cabal test --test-show-details=always

    - name: Generate coverage report
      run: |
        cabal hpc markup --destdir=coverage dist-newstyle/build/*/*/*/bsc-*/hpc/vanilla/tix/bsc-*/bsc.tix

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage/

  performance:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up GHC
      uses: haskell/actions/setup@v2
      with:
        ghc-version: '9.8.1'
        cabal-version: '3.10.1.0'

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cabal/packages
          ~/.cabal/store
          dist-newstyle
        key: ${{ runner.os }}-ghc-9.8.1-${{ hashFiles('**/*.cabal', 'cabal.project') }}
        restore-keys: |
          ${{ runner.os }}-ghc-9.8.1-

    - name: Install criterion
      run: |
        cabal update
        cabal install criterion

    - name: Run benchmarks
      run: |
        cabal bench --benchmark-options="--output bench.html"

    - name: Upload benchmark results
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-results
        path: bench.html

  memory:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up GHC
      uses: haskell/actions/setup@v2
      with:
        ghc-version: '9.8.1'
        cabal-version: '3.10.1.0'

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cabal/packages
          ~/.cabal/store
          dist-newstyle
        key: ${{ runner.os }}-ghc-9.8.1-${{ hashFiles('**/*.cabal', 'cabal.project') }}
        restore-keys: |
          ${{ runner.os }}-ghc-9.8.1-

    - name: Build with memory profiling
      run: |
        cabal update
        cabal build --enable-tests --ghc-options="-prof -fprof-auto -fprof-cafs"

    - name: Run memory leak tests
      run: |
        cabal test --test-show-details=always --ghc-options="-prof -fprof-auto -fprof-cafs"

    - name: Generate memory profile
      run: |
        cabal exec -- ghc-prof-flamegraph dist-newstyle/build/*/*/*/bsc-*/hpc/vanilla/tix/bsc-*/bsc.tix

    - name: Upload memory profile
      uses: actions/upload-artifact@v4
      with:
        name: memory-profile
        path: bsc.svg

  static-analysis:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up GHC
      uses: haskell/actions/setup@v2
      with:
        ghc-version: '9.8.1'
        cabal-version: '3.10.1.0'

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cabal/packages
          ~/.cabal/store
          dist-newstyle
        key: ${{ runner.os }}-ghc-9.8.1-${{ hashFiles('**/*.cabal', 'cabal.project') }}
        restore-keys: |
          ${{ runner.os }}-ghc-9.8.1-

    - name: Install static analysis tools
      run: |
        cabal update
        cabal install weeder liquidhaskell

    - name: Run Weeder
      run: |
        weeder

    - name: Run LiquidHaskell
      run: |
        liquid --check-warnings $(find . -name "*.hs" -not -path "./dist-newstyle/*")

  api-compatibility:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up GHC
      uses: haskell/actions/setup@v2
      with:
        ghc-version: '9.8.1'
        cabal-version: '3.10.1.0'

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cabal/packages
          ~/.cabal/store
          dist-newstyle
        key: ${{ runner.os }}-ghc-9.8.1-${{ hashFiles('**/*.cabal', 'cabal.project') }}
        restore-keys: |
          ${{ runner.os }}-ghc-9.8.1-

    - name: Install API compatibility tools
      run: |
        cabal update
        cabal install cabal-plan

    - name: Check API compatibility
      run: |
        cabal-plan check

  binary-size:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up GHC
      uses: haskell/actions/setup@v2
      with:
        ghc-version: '9.8.1'
        cabal-version: '3.10.1.0'

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cabal/packages
          ~/.cabal/store
          dist-newstyle
        key: ${{ runner.os }}-ghc-9.8.1-${{ hashFiles('**/*.cabal', 'cabal.project') }}
        restore-keys: |
          ${{ runner.os }}-ghc-9.8.1-

    - name: Build with size optimization
      run: |
        cabal update
        cabal build --ghc-options="-O2 -split-sections"

    - name: Check binary size
      run: |
        ls -lh dist-newstyle/build/*/*/*/bsc-*/b/build/bsc/bsc
        ls -lh dist-newstyle/build/*/*/*/bsc-*/b/build/bsc/bsc.exe
