name: CI

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

# Add concurrency control to prevent multiple runs from interfering
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ------------------------------
  # Basic linting requirements for new commits

  build-check-src:
    name: "Check: code cleanliness"
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Check tabs and whitespace
        shell: bash
        run: ".github/workflows/check_whitespace.sh"

  build-check-testsuite:
    name: "Check: testsuite lint"
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    needs: build-check-src
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Check CONFDIR
        run: |
          cd testsuite
          ../.github/workflows/check_confdir.py
          ../.github/workflows/check_symlinks.py

  # ------------------------------
  # Builds for release, using a reliable and stable version of GHC

  build-and-test-ubuntu:
    needs: build-check-testsuite
    if: success() && !contains(github.event.head_commit.message, '[skip-tests]')
    strategy:
      matrix:
        os: [ ubuntu-22.04 ]  # Focus on one stable version
      max-parallel: 1
      fail-fast: false
    name: "Build/Test: ${{ matrix.os }}"
    uses: ./.github/workflows/build-and-test-ubuntu.yml
    with:
      os: ${{ matrix.os }}
      ghc_version: 9.6.6
      hls_version: 2.9.0.1
    secrets: inherit

  build-and-test-macos:
    needs: build-check-testsuite
    if: success() && !contains(github.event.head_commit.message, '[skip-tests]')
    strategy:
      matrix:
        os: [ macos-14 ]  # Focus on one stable version
      max-parallel: 1
      fail-fast: false
    name: "Build/Test: ${{ matrix.os }}"
    uses: ./.github/workflows/build-and-test-macos.yml
    with:
      os: ${{ matrix.os }}
      ghc_version: 9.6.6
      hls_version: 2.9.0.1
    secrets: inherit

  # ------------------------------
  # Tests using other recent versions of GHC, particularly newer ones,
  # in anticipation of upgrading the release builds to that version

  build-and-test-ghc-ubuntu:
    strategy:
      matrix:
        ghc:
          - version: 9.6.6  # Focus on stable version
            hls: 2.9.0.1
      max-parallel: 1
      fail-fast: false
    name: "Build/Test: GHC Ubuntu"
    uses: ./.github/workflows/build-and-test-ubuntu.yml
    with:
      os: ubuntu-22.04
      ghc_version: ${{ matrix.ghc.version }}
      hls_version: ${{ matrix.ghc.hls }}
    secrets: inherit

  build-and-test-ghc-macos:
    strategy:
      matrix:
        ghc:
          - version: 9.6.6  # Focus on stable version
            hls: 2.9.0.1
      max-parallel: 1
      fail-fast: false
    name: "Build/Test: GHC macOS"
    uses: ./.github/workflows/build-and-test-macos.yml
    with:
      os: macos-14
      ghc_version: ${{ matrix.ghc.version }}
      hls_version: ${{ matrix.ghc.hls }}
    secrets: inherit

  # ------------------------------
  # Test the building of documentation

  build-doc-ubuntu:
    needs: build-check-src
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'documentation')
    strategy:
      matrix:
        os: [ ubuntu-22.04 ]  # Focus on one stable version
      fail-fast: false
    name: "Build doc: ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install dependencies
        shell: bash
        run: "sudo .github/workflows/install_dependencies_doc_ubuntu.sh"
      - name: Build
        run: |
          make -j2 install-doc
          tar czf inst.tar.gz inst
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }} build doc
          path: inst.tar.gz
      - name: Upload doc not tar
        uses: actions/upload-artifact@v4
        with:
          name: ${{matrix.os}}-doc-not-tar
          path: inst/doc

  build-doc-macOS:
    needs: build-check-src
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'documentation')
    strategy:
      matrix:
        os: [ macos-14 ]  # Focus on one stable version
      fail-fast: false
    name: "Build doc: ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install dependencies
        shell: bash
        run: ".github/workflows/install_dependencies_doc_macos.sh"
      - name: Build
        run: |
          # Brew install of mactex doesn't update the path until a new shell is opened
          export PATH=/Library/TeX/texbin/:$PATH

          make -j2 install-doc
          tar czf inst.tar.gz inst
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }} build doc
          path: inst.tar.gz
      - name: Upload doc not tar
        uses: actions/upload-artifact@v4
        with:
          name: ${{matrix.os}}-doc-not-tar
          path: inst/doc

  # ------------------------------
  # Build platform-generic documents for releases

  build-releasenotes-ubuntu:
    needs: build-check-src
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'documentation')
    strategy:
      matrix:
        os: [ ubuntu-22.04 ]
      fail-fast: false
    name: "Build releasenotes: ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install dependencies
        shell: bash
        run: "sudo .github/workflows/install_dependencies_releasenotes_ubuntu.sh"
      - name: Build
        run: |
          make install-release
          tar czf inst.tar.gz inst
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }} releasenotes
          path: inst.tar.gz
