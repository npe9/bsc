name: CI

# Trigger the workflow on push or pull request
on: [ push, pull_request ]

jobs:
  # ------------------------------
  # Basic linting requirements for new commits

  build-check-src:
    name: "Check: code cleanliness"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check tabs and whitespace
        shell: bash
        run: ".github/workflows/check_whitespace.sh"

  build-check-testsuite:
    name: "Check: testsuite lint"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check CONFDIR
        run: |
          cd testsuite
          ../.github/workflows/check_confdir.py
          ../.github/workflows/check_symlinks.py

  # ------------------------------
  # Builds for release, using a reliable and stable version of GHC

  build-and-test-ubuntu:
    strategy:
      matrix:
        os: [ '22.04', '24.04' ]
      fail-fast: false
    name: "Build/Test: ubuntu-${{ matrix.os }}"
    uses: ./.github/workflows/build-and-test-ubuntu-docker.yml
    with:
      os: ${{ matrix.os }}
      ghc_version: 9.6.7
      hls_version: 2.10.0.0
    permissions:
      contents: read
      packages: write
    secrets: inherit

  # ------------------------------
  # Tests using other recent versions of GHC, particularly newer ones,
  # in anticipation of upgrading the release builds to that version

  build-and-test-ghc-ubuntu:
    strategy:
      matrix:
        os: [ '22.04' ]
        ghc:
          - version: 9.4.8
            hls: 2.10.0.0
          - version: 9.8.4
            hls: 2.10.0.0
          - version: 9.10.1
            hls: 2.10.0.0
          - version: 9.12.2
            hls: 2.10.0.0
      fail-fast: false
    name: "Build/Test: GHC Ubuntu"
    uses: ./.github/workflows/build-and-test-ubuntu-docker.yml
    with:
      os: ${{ matrix.os }}
      ghc_version: ${{ matrix.ghc.version }}
      hls_version: ${{ matrix.ghc.hls }}
    permissions:
      contents: read
      packages: write
    secrets: inherit

  # ------------------------------
  # Test the building of documentation

  build-doc-ubuntu:
    strategy:
      matrix:
        os: [ '22.04', '24.04' ]
      fail-fast: false
    name: "Build doc: ubuntu-${{ matrix.os }}"
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}:ubuntu-${{ matrix.os }}-ghc-9.6.7
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install doc dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-fonts-extra
      - name: Build
        run: |
          make -j3 install-doc
          tar czf inst.tar.gz inst
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-${{ matrix.os }} build doc
          path: inst.tar.gz
      - name: Upload doc not tar
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-${{ matrix.os }}-doc-not-tar
          path: inst/doc
