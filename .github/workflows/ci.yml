name: BSC CI

on:
  push:
    branches: [ "runner-matrix" ]
  pull_request:
    branches: [ "runner-matrix" ]

env:
  DOCKER_BUILDKIT: 1

jobs:
  build-images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ghc-version: [9.2.8, 9.4.8, 9.6.6, 9.8.4, 9.10.1, 9.12.1]
        ubuntu-version: [20.04, 22.04]
        exclude:
          - ghc-version: 9.12.1
            ubuntu-version: 20.04
          - ghc-version: 9.10.1
            ubuntu-version: 20.04
          - ghc-version: 9.8.4
            ubuntu-version: 20.04
          - ghc-version: 9.6.6
            ubuntu-version: 20.04
          - ghc-version: 9.4.8
            ubuntu-version: 20.04
          - ghc-version: 9.2.8
            ubuntu-version: 22.04

    steps:
    - uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v1
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push GHC base image
      uses: docker/build-push-action@v2
      with:
        context: .
        file: .github/workflows/Dockerfile.ghc-base
        push: true
        tags: ghcr.io/npe9/bsc-ghc-base-${{ matrix.ghc-version }}-${{ matrix.ubuntu-version }}
        build-args: |
          GHC_VERSION=${{ matrix.ghc-version }}
          UBUNTU_VERSION=${{ matrix.ubuntu-version }}

    - name: Build and push builder image
      uses: docker/build-push-action@v2
      with:
        context: .
        file: .github/workflows/Dockerfile.bsc-builder
        push: true
        tags: ghcr.io/npe9/bsc-builder-${{ matrix.ghc-version }}-${{ matrix.ubuntu-version }}
        build-args: |
          GHC_VERSION=${{ matrix.ghc-version }}
          UBUNTU_VERSION=${{ matrix.ubuntu-version }}

    - name: Build and push runtime image
      uses: docker/build-push-action@v2
      with:
        context: .
        file: .github/workflows/Dockerfile.bsc-runtime
        push: true
        tags: ghcr.io/npe9/bsc-runtime-${{ matrix.ghc-version }}-${{ matrix.ubuntu-version }}
        build-args: |
          GHC_VERSION=${{ matrix.ghc-version }}
          UBUNTU_VERSION=${{ matrix.ubuntu-version }}

  test:
    needs: build-images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ghc-version: [9.2.8, 9.4.8, 9.6.6, 9.8.4, 9.10.1, 9.12.1]
        ubuntu-version: [20.04, 22.04]
        exclude:
          - ghc-version: 9.12.1
            ubuntu-version: 20.04
          - ghc-version: 9.10.1
            ubuntu-version: 20.04
          - ghc-version: 9.8.4
            ubuntu-version: 20.04
          - ghc-version: 9.6.6
            ubuntu-version: 20.04
          - ghc-version: 9.4.8
            ubuntu-version: 20.04
          - ghc-version: 9.2.8
            ubuntu-version: 22.04

    steps:
    - uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v1
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Pull runtime image
      run: |
        docker pull ghcr.io/npe9/bsc-runtime-${{ matrix.ghc-version }}-${{ matrix.ubuntu-version }}

    - name: Run smoke tests
      run: |
        docker run --rm \
          -v $(pwd):/work \
          ghcr.io/npe9/bsc-runtime-${{ matrix.ghc-version }}-${{ matrix.ubuntu-version }} \
          bash -c 'cd /work && make check-smoke'

    - name: Run regression tests
      run: |
        docker run --rm \
          -v $(pwd):/work \
          ghcr.io/npe9/bsc-runtime-${{ matrix.ghc-version }}-${{ matrix.ubuntu-version }} \
          bash -c 'cd /work && make check-regression'

    - name: Save test logs
      if: always()
      uses: actions/upload-artifact@v2
      with:
        name: test-logs-${{ matrix.ghc-version }}-${{ matrix.ubuntu-version }}
        path: |
          **/test.log
          **/regression.log
        retention-days: 5
