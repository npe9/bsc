name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  GHC_VERSION: "9.6.6"
  CABAL_VERSION: "3.10.1.0"

jobs:
  build-ubuntu:
    name: "Build Ubuntu"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            bsc/
            bdw/
            bsc-make/
            .github/
            .gitattributes
            .gitignore
            Makefile
            README.md
            testsuite/
            util/
          sparse-checkout-cone-mode: false

      - name: Configure Git
        run: |
          git config --global --add safe.directory /work
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"

      - name: Set up Haskell
        uses: haskell/actions/setup@v2
        with:
          ghc-version: ${{ env.GHC_VERSION }}
          cabal-version: ${{ env.CABAL_VERSION }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            git \
            libffi-dev \
            libgmp-dev \
            libncurses-dev \
            libtinfo-dev \
            make \
            python3 \
            python3-pip \
            wget \
            zlib1g-dev \
            ccache

      - name: Build
        env:
          CCACHE_DIR: ${{ github.workspace }}/ccache
          CCACHE_COMPRESS: true
          CCACHE_COMPRESSLEVEL: 6
          CABAL_JOBS: 2
          MAKEFLAGS: "-j2"
        run: |
          # Configure ccache
          ccache --zero-stats --max-size 250M
          export PATH=/usr/lib/ccache:$PATH

          # Configure cabal build options
          echo "package *" > cabal.project.local
          echo "  optimization: 1" >> cabal.project.local
          echo "  split-sections: true" >> cabal.project.local
          echo "  ghc-options: -j2 +RTS -M4500M -A128m -RTS" >> cabal.project.local

          # Build and install
          cabal v2-build --ghc-options="+RTS -M4500M -A128m -RTS" -j2
          cabal v2-install --installdir=inst/bin

          # Create distribution
          cabal v2-sdist
          tar xzf dist-newstyle/sdist/bsc-*.tar.gz -C dist-newstyle/sdist/
          cd dist-newstyle/sdist/bsc-*
          cabal v2-build --ghc-options="+RTS -M4500M -A128m -RTS" -j2
          cabal v2-install --installdir=../../../../inst/bin
          cd ../../../..

          # Package the installation
          tar czf inst.tar.gz inst

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bsc-ubuntu-${{ github.sha }}
          path: inst.tar.gz

  test-ubuntu:
    name: "Test Ubuntu"
    needs: build-ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            bsc/
            bdw/
            bsc-make/
            .github/
            .gitattributes
            .gitignore
            Makefile
            README.md
            testsuite/
            util/
          sparse-checkout-cone-mode: false

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: bsc-ubuntu-${{ github.sha }}
          path: .

      - name: Extract build artifacts
        run: tar xzf inst.tar.gz

      - name: Configure Git
        run: |
          git config --global --add safe.directory /work
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"

      - name: Run tests
        env:
          PATH: ${{ github.workspace }}/inst/bin:$PATH
        run: |
          make -C testsuite check
