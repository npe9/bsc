name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-ubuntu:
    name: "Build Ubuntu"
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            bsc/
            bdw/
            bsc-make/
            .github/
            .gitattributes
            .gitignore
            Makefile
            README.md
            testsuite/
            util/
          sparse-checkout-cone-mode: false

      - name: Configure Git
        run: |
          git config --global --add safe.directory /work
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"

      - name: Build
        run: |
          # Build and install
          cabal v2-build --ghc-options="+RTS -M4500M -A128m -RTS" -j2
          cabal v2-install --installdir=inst/bin

          # Create distribution
          cabal v2-sdist
          tar xzf dist-newstyle/sdist/bsc-*.tar.gz -C dist-newstyle/sdist/
          cd dist-newstyle/sdist/bsc-*
          cabal v2-build --ghc-options="+RTS -M4500M -A128m -RTS" -j2
          cabal v2-install --installdir=../../../../inst/bin
          cd ../../../..

          # Package the installation
          tar czf inst.tar.gz inst

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bsc-ubuntu-${{ github.sha }}
          path: inst.tar.gz

  test-ubuntu:
    name: "Test Ubuntu"
    needs: build-ubuntu
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            bsc/
            bdw/
            bsc-make/
            .github/
            .gitattributes
            .gitignore
            Makefile
            README.md
            testsuite/
            util/
          sparse-checkout-cone-mode: false

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: bsc-ubuntu-${{ github.sha }}
          path: .

      - name: Extract build artifacts
        run: tar xzf inst.tar.gz

      - name: Configure Git
        run: |
          git config --global --add safe.directory /work
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"

      - name: Run tests
        env:
          PATH: ${{ github.workspace }}/inst/bin:$PATH
        run: |
          make -C testsuite check
