        cabal-version: ${{ env.CABAL_VERSION }}
        stack-version: ${{ env.STACK_VERSION }}
        stack-no-global: true
        stack-setup-ghc: true
        enable-stack: true

    - name: Check GHCI load
      run: |
        make -j${{ env.MAKE_JOBS }} test-ghci

  # macOS jobs
  macos:
    name: macOS
    runs-on: macos-14
    steps:
    - name: Checkout
      uses: actions/checkout@v3
      with:
        token: ${{ secrets.WORKFLOW_PAT }}
    - name: Setup
      run: echo "Starting macOS jobs"

  # macOS build jobs
  macos-build:
    name: Build (macOS ${{ matrix.os_version }}, GHC ${{ matrix.ghc_version }})
