name: Matrix Build and Test

on:
  push:
    branches: [ main ]
    paths:
      - '**.hs'
      - '**.cabal'
      - '**.c'
      - '**.cpp'
      - '**.h'
      - '**.hsc'
      - 'Makefile'
      - '.github/workflows/**'
  pull_request:
    branches: [ main ]
    paths:
      - '**.hs'
      - '**.cabal'
      - '**.c'
      - '**.cpp'
      - '**.h'
      - '**.hsc'
      - 'Makefile'
      - '.github/workflows/**'
  workflow_dispatch:

env:
  CABAL_VERSION: "3.10.2.1"
  STACK_VERSION: "2.13.1"
  CCACHE_DIR: /tmp/ccache
  CCACHE_MAXSIZE: 500M
  GHCJOBS: $(nproc)
  CABAL_JOBS: $(nproc)
  MAKE_JOBS: $(nproc)
  CABAL_TEST_JOBS: $(nproc)
  COMMON_DEPENDENCIES: "aeson base bytestring containers deepseq directory filepath mtl network process random stm text time transformers unix vector"

jobs:
  # Ubuntu jobs
  ubuntu-build:
    name: Build (Ubuntu ${{ matrix.ubuntu_version }}, GHC ${{ matrix.ghc }})
    runs-on: ubuntu-${{ matrix.ubuntu_version }}
    timeout-minutes: 60
    env:
      GHC_VERSION: ${{ matrix.ghc }}
      CABAL_BUILD_OPTIONS: "--ghc-options=-j$(nproc) --enable-tests --enable-benchmarks --enable-optimization=2"
    strategy:
      fail-fast: false
      matrix:
        ubuntu_version: [20.04, 22.04, 24.04]
        ghc: [9.6.6]
        build_type: [release]
        include:
          - ubuntu_version: 22.04
            ghc: 9.4.8
            build_type: test
          - ubuntu_version: 22.04
            ghc: 9.8.4
            build_type: test
          - ubuntu_version: 22.04
            ghc: 9.10.1
            build_type: test
          - ubuntu_version: 22.04
            ghc: 9.12.1
            build_type: test

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Cache GHC
      uses: actions/cache@v4
      id: cache-ghc
      with:
        path: |
          ~/.ghcup
          ~/.cabal/store
          ~/.cabal/packages
        key: ${{ runner.os }}-${{ matrix.ubuntu_version }}-ghc-${{ matrix.ghc }}-${{ hashFiles('**/*.cabal') }}-${{ hashFiles('cabal.project') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.ubuntu_version }}-ghc-${{ matrix.ghc }}-

    - name: Cache common dependencies
      uses: actions/cache@v4
      id: cache-common-deps
      with:
        path: |
          ~/.cabal/store
          ~/.cabal/packages
        key: ${{ runner.os }}-${{ matrix.ubuntu_version }}-common-deps-${{ matrix.ghc }}-${{ hashFiles('**/*.cabal') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.ubuntu_version }}-common-deps-${{ matrix.ghc }}-

    - name: Setup GHC
      uses: haskell/actions/setup@v2
      with:
        ghc-version: ${{ matrix.ghc }}
        cabal-version: ${{ env.CABAL_VERSION }}
        stack-version: ${{ env.STACK_VERSION }}
        stack-no-global: true
        stack-setup-ghc: true
        enable-stack: true

    - name: Pre-download common dependencies
      if: steps.cache-common-deps.outputs.cache-hit != 'true'
      run: |
        cabal update
        for dep in ${{ env.COMMON_DEPENDENCIES }}; do
          cabal install --lib $dep --package-env=/tmp/common-deps --overwrite-policy=always
        done

    - name: Cache build artifacts
      uses: actions/cache@v4
      id: cache-build
      with:
        path: |
          dist-newstyle
          .stack-work
        key: ${{ runner.os }}-${{ matrix.ubuntu_version }}-build-${{ matrix.ghc }}-${{ hashFiles('**/*.hs', '**/*.cabal', '**/*.hsc', '**/*.h', '**/*.c', '**/*.cpp', 'cabal.project') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.ubuntu_version }}-build-${{ matrix.ghc }}-

    - name: Cache ccache
      uses: actions/cache@v4
      id: cache-ccache
      with:
        path: /tmp/ccache
        key: ${{ runner.os }}-${{ matrix.ubuntu_version }}-ccache-${{ matrix.ghc }}-${{ hashFiles('**/*.c', '**/*.cpp', '**/*.h') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.ubuntu_version }}-ccache-${{ matrix.ghc }}-

    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ${{ runner.os }}-${{ matrix.ubuntu_version }}-ccache-${{ matrix.ghc }}
        max-size: 500M

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          curl \
          libffi-dev \
          libffi8ubuntu1 \
          libgmp-dev \
          libgmp10 \
          libncurses-dev \
          libncurses5 \
          libtinfo5 \
          libz3-dev \
          zlib1g-dev \
          libghc-split-dev

    - name: Cache Haskell dependencies
      uses: actions/cache@v4
      id: cache-deps
      with:
        path: |
          ~/.cabal/store
          ~/.stack
          dist-newstyle
        key: ${{ runner.os }}-${{ matrix.ubuntu_version }}-deps-${{ matrix.ghc }}-${{ hashFiles('**/*.cabal', 'cabal.project') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.ubuntu_version }}-deps-${{ matrix.ghc }}-

    - name: Install Haskell dependencies
      run: |
        cabal update
        cabal build --only-dependencies -j${{ env.CABAL_JOBS }} ${{ env.CABAL_BUILD_OPTIONS }}

    - name: Build
      run: |
        make -j${{ env.MAKE_JOBS }} GHCJOBS=${{ env.GHCJOBS }} CABAL_JOBS=${{ env.CABAL_JOBS }} CABAL_BUILD_OPTIONS="${{ env.CABAL_BUILD_OPTIONS }}"

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-ubuntu-${{ matrix.ubuntu_version }}-${{ matrix.ghc }}-${{ matrix.build_type }}
        path: |
          dist-newstyle
          .stack-work
        retention-days: 1
        compression-level: 9

  # Test jobs for Ubuntu
  ubuntu-test:
    name: Test (Ubuntu ${{ matrix.ubuntu_version }}, GHC ${{ matrix.ghc }})
    needs: ubuntu-build
    runs-on: ubuntu-${{ matrix.ubuntu_version }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        ubuntu_version: [20.04, 22.04, 24.04]
        ghc: [9.6.6]
        build_type: [release]
        include:
          - ubuntu_version: 22.04
            ghc: 9.4.8
            build_type: test
          - ubuntu_version: 22.04
            ghc: 9.8.4
            build_type: test
          - ubuntu_version: 22.04
            ghc: 9.10.1
            build_type: test
          - ubuntu_version: 22.04
            ghc: 9.12.1
            build_type: test

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: build-ubuntu-${{ matrix.ubuntu_version }}-${{ matrix.ghc }}-${{ matrix.build_type }}
        path: .

    - name: Cache GHC
      uses: actions/cache@v4
      id: cache-ghc
      with:
        path: |
          ~/.ghcup
          ~/.cabal/store
          ~/.cabal/packages
        key: ${{ runner.os }}-${{ matrix.ubuntu_version }}-ghc-${{ matrix.ghc }}-${{ hashFiles('**/*.cabal') }}-${{ hashFiles('cabal.project') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.ubuntu_version }}-ghc-${{ matrix.ghc }}-

    - name: Setup GHC
      uses: haskell/actions/setup@v2
      with:
        ghc-version: ${{ matrix.ghc }}
        cabal-version: ${{ env.CABAL_VERSION }}
        stack-version: ${{ env.STACK_VERSION }}
        stack-no-global: true
        stack-setup-ghc: true
        enable-stack: true

    - name: Run smoke tests
      run: |
        cabal test -j${{ env.CABAL_TEST_JOBS }} --test-show-details=direct --test-option=--num-threads=${{ env.CABAL_TEST_JOBS }}

  # HLS jobs for Ubuntu
  ubuntu-hls:
    name: HLS (Ubuntu ${{ matrix.ubuntu_version }}, GHC ${{ matrix.ghc }})
    needs: ubuntu-build
    runs-on: ubuntu-${{ matrix.ubuntu_version }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        ubuntu_version: [20.04, 22.04, 24.04]
        ghc: [9.6.6]
        build_type: [release]
        include:
          - ubuntu_version: 22.04
            ghc: 9.4.8
            build_type: test
          - ubuntu_version: 22.04
            ghc: 9.8.4
            build_type: test
          - ubuntu_version: 22.04
            ghc: 9.10.1
            build_type: test
          - ubuntu_version: 22.04
            ghc: 9.12.1
            build_type: test

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: build-ubuntu-${{ matrix.ubuntu_version }}-${{ matrix.ghc }}-${{ matrix.build_type }}
        path: .

    - name: Cache GHC
      uses: actions/cache@v4
      id: cache-ghc
      with:
        path: |
          ~/.ghcup
          ~/.cabal/store
          ~/.cabal/packages
        key: ${{ runner.os }}-${{ matrix.ubuntu_version }}-ghc-${{ matrix.ghc }}-${{ hashFiles('**/*.cabal') }}-${{ hashFiles('cabal.project') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.ubuntu_version }}-ghc-${{ matrix.ghc }}-

    - name: Setup GHC
      uses: haskell/actions/setup@v2
      with:
        ghc-version: ${{ matrix.ghc }}
        cabal-version: ${{ env.CABAL_VERSION }}
        stack-version: ${{ env.STACK_VERSION }}
        stack-no-global: true
        stack-setup-ghc: true
        enable-stack: true

    - name: Test HLS
      if: matrix.ghc != '9.12.1'
      run: |
        make -j${{ env.MAKE_JOBS }} test-hls

  # GHCI jobs for Ubuntu
  ubuntu-ghci:
    name: GHCI (Ubuntu ${{ matrix.ubuntu_version }}, GHC ${{ matrix.ghc }})
    needs: ubuntu-build
    runs-on: ubuntu-${{ matrix.ubuntu_version }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        ubuntu_version: [20.04, 22.04, 24.04]
        ghc: [9.6.6]
        build_type: [release]
        include:
          - ubuntu_version: 22.04
            ghc: 9.4.8
            build_type: test
          - ubuntu_version: 22.04
            ghc: 9.8.4
            build_type: test
          - ubuntu_version: 22.04
            ghc: 9.10.1
            build_type: test
          - ubuntu_version: 22.04
            ghc: 9.12.1
            build_type: test

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: build-ubuntu-${{ matrix.ubuntu_version }}-${{ matrix.ghc }}-${{ matrix.build_type }}
        path: .

    - name: Cache GHC
      uses: actions/cache@v4
      id: cache-ghc
      with:
        path: |
          ~/.ghcup
          ~/.cabal/store
          ~/.cabal/packages
        key: ${{ runner.os }}-${{ matrix.ubuntu_version }}-ghc-${{ matrix.ghc }}-${{ hashFiles('**/*.cabal') }}-${{ hashFiles('cabal.project') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.ubuntu_version }}-ghc-${{ matrix.ghc }}-

    - name: Setup GHC
      uses: haskell/actions/setup@v2
      with:
        ghc-version: ${{ matrix.ghc }}
        cabal-version: ${{ env.CABAL_VERSION }}
        stack-version: ${{ env.STACK_VERSION }}
        stack-no-global: true
        stack-setup-ghc: true
        enable-stack: true

    - name: Check GHCI load
      run: |
        make -j${{ env.MAKE_JOBS }} test-ghci

  # macOS jobs
  macos-build:
    name: Build (macOS ${{ matrix.macos_version }}, GHC ${{ matrix.ghc }})
    runs-on: macos-${{ matrix.macos_version }}
    timeout-minutes: 60
    env:
      GHC_VERSION: ${{ matrix.ghc }}
    strategy:
      fail-fast: false
      matrix:
        macos_version: [13, 14, 15]
        ghc: [9.6.6]
        build_type: [release]
        include:
          - macos_version: 14
            ghc: 9.4.8
            build_type: test
          - macos_version: 14
            ghc: 9.8.4
            build_type: test
          - macos_version: 14
            ghc: 9.10.1
            build_type: test
          - macos_version: 14
            ghc: 9.12.1
            build_type: test

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Cache GHC
      uses: actions/cache@v4
      id: cache-ghc
      with:
        path: |
          ~/.ghcup
          ~/.cabal/store
          ~/.cabal/packages
        key: macos-${{ matrix.macos_version }}-ghc-${{ matrix.ghc }}-${{ hashFiles('**/*.cabal') }}
        restore-keys: |
          macos-${{ matrix.macos_version }}-ghc-${{ matrix.ghc }}-

    - name: Cache build artifacts
      uses: actions/cache@v4
      id: cache-build
      with:
        path: |
          dist-newstyle
          .stack-work
        key: macos-${{ matrix.macos_version }}-build-${{ matrix.ghc }}-${{ hashFiles('**/*.hs', '**/*.cabal', '**/*.hsc', '**/*.h', '**/*.c', '**/*.cpp') }}
        restore-keys: |
          macos-${{ matrix.macos_version }}-build-${{ matrix.ghc }}-

    - name: Cache ccache
      uses: actions/cache@v4
      id: cache-ccache
      with:
        path: /tmp/ccache
        key: macos-${{ matrix.macos_version }}-ccache-${{ matrix.ghc }}-${{ hashFiles('**/*.c', '**/*.cpp', '**/*.h') }}
        restore-keys: |
          macos-${{ matrix.macos_version }}-ccache-${{ matrix.ghc }}-

    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: macos-${{ matrix.macos_version }}-ccache-${{ matrix.ghc }}
        max-size: 500M

    - name: Install system dependencies
      run: |
        brew update
        brew install gmp z3

    - name: Setup GHC
      uses: haskell/actions/setup@v2
      with:
        ghc-version: ${{ matrix.ghc }}
        cabal-version: ${{ env.CABAL_VERSION }}
        stack-version: ${{ env.STACK_VERSION }}
        stack-no-global: true
        stack-setup-ghc: true
        enable-stack: true

    - name: Cache Haskell dependencies
      uses: actions/cache@v4
      id: cache-deps
      with:
        path: |
          ~/.cabal/store
          ~/.stack
          dist-newstyle
        key: macos-${{ matrix.macos_version }}-deps-${{ matrix.ghc }}-${{ hashFiles('**/*.cabal') }}
        restore-keys: |
          macos-${{ matrix.macos_version }}-deps-${{ matrix.ghc }}-

    - name: Install Haskell dependencies
      run: |
        cabal update
        cabal build --only-dependencies -j${{ env.CABAL_JOBS }}

    - name: Build
      run: |
        make -j${{ env.MAKE_JOBS }} GHCJOBS=${{ env.GHCJOBS }} CABAL_JOBS=${{ env.CABAL_JOBS }}

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-macos-${{ matrix.macos_version }}-${{ matrix.ghc }}-${{ matrix.build_type }}
        path: |
          dist-newstyle
          .stack-work
        retention-days: 1
        compression-level: 9

  # Test jobs for macOS
  macos-test:
    name: Test (macOS ${{ matrix.macos_version }}, GHC ${{ matrix.ghc }})
    needs: macos-build
    runs-on: macos-${{ matrix.macos_version }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        macos_version: [13, 14, 15]
        ghc: [9.6.6]
        build_type: [release]
        include:
          - macos_version: 14
            ghc: 9.4.8
            build_type: test
          - macos_version: 14
            ghc: 9.8.4
            build_type: test
          - macos_version: 14
            ghc: 9.10.1
            build_type: test
          - macos_version: 14
            ghc: 9.12.1
            build_type: test

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: build-macos-${{ matrix.macos_version }}-${{ matrix.ghc }}-${{ matrix.build_type }}
        path: .

    - name: Cache GHC
      uses: actions/cache@v4
      id: cache-ghc
      with:
        path: |
          ~/.ghcup
          ~/.cabal/store
          ~/.cabal/packages
        key: macos-${{ matrix.macos_version }}-ghc-${{ matrix.ghc }}-${{ hashFiles('**/*.cabal') }}
        restore-keys: |
          macos-${{ matrix.macos_version }}-ghc-${{ matrix.ghc }}-

    - name: Setup GHC
      uses: haskell/actions/setup@v2
      with:
        ghc-version: ${{ matrix.ghc }}
        cabal-version: ${{ env.CABAL_VERSION }}
        stack-version: ${{ env.STACK_VERSION }}
        stack-no-global: true
        stack-setup-ghc: true
        enable-stack: true

    - name: Run smoke tests
      run: |
        make -j${{ env.MAKE_JOBS }} smoke-tests

  # HLS jobs for macOS
  macos-hls:
    name: HLS (macOS ${{ matrix.macos_version }}, GHC ${{ matrix.ghc }})
    needs: macos-build
    runs-on: macos-${{ matrix.macos_version }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        macos_version: [13, 14, 15]
        ghc: [9.6.6]
        build_type: [release]
        include:
          - macos_version: 14
            ghc: 9.4.8
            build_type: test
          - macos_version: 14
            ghc: 9.8.4
            build_type: test
          - macos_version: 14
            ghc: 9.10.1
            build_type: test
          - macos_version: 14
            ghc: 9.12.1
            build_type: test

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: build-macos-${{ matrix.macos_version }}-${{ matrix.ghc }}-${{ matrix.build_type }}
        path: .

    - name: Cache GHC
      uses: actions/cache@v4
      id: cache-ghc
      with:
        path: |
          ~/.ghcup
          ~/.cabal/store
          ~/.cabal/packages
        key: macos-${{ matrix.macos_version }}-ghc-${{ matrix.ghc }}-${{ hashFiles('**/*.cabal') }}
        restore-keys: |
          macos-${{ matrix.macos_version }}-ghc-${{ matrix.ghc }}-

    - name: Setup GHC
      uses: haskell/actions/setup@v2
      with:
        ghc-version: ${{ matrix.ghc }}
        cabal-version: ${{ env.CABAL_VERSION }}
        stack-version: ${{ env.STACK_VERSION }}
        stack-no-global: true
        stack-setup-ghc: true
        enable-stack: true

    - name: Test HLS
      if: matrix.ghc != '9.12.1'
      run: |
        make -j${{ env.MAKE_JOBS }} test-hls

  # GHCI jobs for macOS
  macos-ghci:
    name: GHCI (macOS ${{ matrix.macos_version }}, GHC ${{ matrix.ghc }})
    needs: macos-build
    runs-on: macos-${{ matrix.macos_version }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        macos_version: [13, 14, 15]
        ghc: [9.6.6]
        build_type: [release]
        include:
          - macos_version: 14
            ghc: 9.4.8
            build_type: test
          - macos_version: 14
            ghc: 9.8.4
            build_type: test
          - macos_version: 14
            ghc: 9.10.1
            build_type: test
          - macos_version: 14
            ghc: 9.12.1
            build_type: test

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: build-macos-${{ matrix.macos_version }}-${{ matrix.ghc }}-${{ matrix.build_type }}
        path: .

    - name: Cache GHC
      uses: actions/cache@v4
      id: cache-ghc
      with:
        path: |
          ~/.ghcup
          ~/.cabal/store
          ~/.cabal/packages
        key: macos-${{ matrix.macos_version }}-ghc-${{ matrix.ghc }}-${{ hashFiles('**/*.cabal') }}
        restore-keys: |
          macos-${{ matrix.macos_version }}-ghc-${{ matrix.ghc }}-

    - name: Setup GHC
      uses: haskell/actions/setup@v2
      with:
        ghc-version: ${{ matrix.ghc }}
        cabal-version: ${{ env.CABAL_VERSION }}
        stack-version: ${{ env.STACK_VERSION }}
        stack-no-global: true
        stack-setup-ghc: true
        enable-stack: true

    - name: Check GHCI load
      run: |
        make -j${{ env.MAKE_JOBS }} test-ghci

    - name: Create cabal.project
      run: |
        cat > cabal.project << EOF
        packages: .
        tests: True
        benchmarks: True
        optimization: 2
        documentation: False
        tests-show-details: direct
        tests-show-log: True
        tests-keep-tix: True
        tests-keep-going: True
        tests-jobs: ${{ env.CABAL_TEST_JOBS }}
        EOF 