            ghc_version: 9.4.8
            build_type: test
          - os_version: 22.04
            ghc_version: 9.8.4
            build_type: test
          - os_version: 22.04
            ghc_version: 9.10.1
            build_type: test
          - os_version: 22.04
            ghc_version: 9.12.1
            build_type: test

    steps:
    - uses: actions/checkout@v3
      with:
        token: ${{ secrets.WORKFLOW_PAT }}
        fetch-depth: 0

    - name: Download build artifacts
      uses: actions/download-artifact@v4.1.4
      with:
        name: build-ubuntu-${{ matrix.os_version }}-${{ matrix.ghc_version }}-${{ matrix.build_type }}
        path: .

    - name: Cache GHC
      uses: actions/cache@v3
      id: cache-ghc
      with:
