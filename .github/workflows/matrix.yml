    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: build-ubuntu-${{ matrix.ubuntu_version }}-${{ matrix.ghc }}-${{ matrix.build_type }}
        path: .

    - name: Cache GHC
      uses: actions/cache@v4
      id: cache-ghc
      with:
        path: |
          ~/.ghcup
          ~/.cabal/store
          ~/.cabal/packages
        key: ubuntu-${{ matrix.ubuntu_version }}-ghc-${{ matrix.ghc }}-${{ hashFiles('**/*.cabal') }}

    - name: Setup GHC
      uses: haskell/actions/setup@v2
      with:
        ghc-version: ${{ matrix.ghc }}
        cabal-version: ${{ env.CABAL_VERSION }}
        stack-version: ${{ env.STACK_VERSION }}
        stack-no-global: true
        stack-setup-ghc: true
        enable-stack: true

    - name: Check GHCI load
      run: |
        make -j${{ env.MAKE_JOBS }} test-ghci

  # GHCI jobs for macOS
  macos-ghci:
    name: GHCI (macOS ${{ matrix.macos_version }}, GHC ${{ matrix.ghc }})
    needs: macos-build
    runs-on: macos-${{ matrix.macos_version }}
    timeout-minutes: 20
    strategy:
      matrix:
        macos_version: [13, 14, 15]
        ghc: [9.6.6]
        build_type: [release]
        include:
          - macos_version: 14
            ghc: 9.4.8
            build_type: test
          - macos_version: 14
            ghc: 9.8.4
            build_type: test
          - macos_version: 14
            ghc: 9.10.1
            build_type: test
          - macos_version: 14
            ghc: 9.12.1
            build_type: test

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: build-macos-${{ matrix.macos_version }}-${{ matrix.ghc }}-${{ matrix.build_type }}
