name: Matrix Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  CABAL_VERSION: "3.10.2.1"
  STACK_VERSION: "2.13.1"
  CCACHE_DIR: /tmp/ccache
  CCACHE_MAXSIZE: 500M
  GHCJOBS: $(nproc)
  CABAL_JOBS: $(nproc)
  MAKE_JOBS: $(nproc)

jobs:
  # Ubuntu jobs
  ubuntu-build:
    name: Build (Ubuntu ${{ matrix.ubuntu_version }}, GHC ${{ matrix.ghc }})
    runs-on: ubuntu-${{ matrix.ubuntu_version }}
    timeout-minutes: 60
    env:
      GHC_VERSION: ${{ matrix.ghc }}
    strategy:
      matrix:
        ubuntu_version: [20.04, 22.04, 24.04]
        ghc: [9.6.6]
        build_type: [release]
        include:
          - ubuntu_version: 22.04
            ghc: 9.4.8
            build_type: test
          - ubuntu_version: 22.04
            ghc: 9.8.4
            build_type: test
          - ubuntu_version: 22.04
            ghc: 9.10.1
            build_type: test
          - ubuntu_version: 22.04
            ghc: 9.12.1
            build_type: test

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Cache GHC
      uses: actions/cache@v4
      id: cache-ghc
      with:
        path: |
          ~/.ghcup
          ~/.cabal/store
          ~/.cabal/packages
        key: ubuntu-${{ matrix.ubuntu_version }}-ghc-${{ matrix.ghc }}-${{ hashFiles('**/*.cabal') }}

    - name: Cache build artifacts
      uses: actions/cache@v4
      id: cache-build
      with:
        path: |
          dist-newstyle
          .stack-work
        key: ubuntu-${{ matrix.ubuntu_version }}-build-${{ matrix.ghc }}-${{ hashFiles('**/*.hs', '**/*.cabal', '**/*.hsc', '**/*.h', '**/*.c', '**/*.cpp') }}

    - name: Cache ccache
      uses: actions/cache@v4
      id: cache-ccache
      with:
        path: /tmp/ccache
        key: ubuntu-${{ matrix.ubuntu_version }}-ccache-${{ matrix.ghc }}-${{ hashFiles('**/*.c', '**/*.cpp', '**/*.h') }}

    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ubuntu-${{ matrix.ubuntu_version }}-ccache-${{ matrix.ghc }}
        max-size: 500M

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          curl \
          libffi-dev \
          libffi8ubuntu1 \
          libgmp-dev \
          libgmp10 \
          libncurses-dev \
          libncurses5 \
          libtinfo5 \
          libz3-dev \
          zlib1g-dev \
          libghc-split-dev

    - name: Setup GHC
      uses: haskell/actions/setup@v2
      with:
        ghc-version: ${{ matrix.ghc }}
        cabal-version: ${{ env.CABAL_VERSION }}
        stack-version: ${{ env.STACK_VERSION }}
        stack-no-global: true
        stack-setup-ghc: true
        enable-stack: true

    - name: Cache Haskell dependencies
      uses: actions/cache@v4
      id: cache-deps
      with:
        path: |
          ~/.cabal/store
          ~/.stack
          dist-newstyle
        key: ubuntu-${{ matrix.ubuntu_version }}-deps-${{ matrix.ghc }}-${{ hashFiles('**/*.cabal') }}

    - name: Install Haskell dependencies
      run: |
        cabal update
        cabal build --only-dependencies -j${{ env.CABAL_JOBS }}

    - name: Build
      run: |
        make -j${{ env.MAKE_JOBS }} GHCJOBS=${{ env.GHCJOBS }} CABAL_JOBS=${{ env.CABAL_JOBS }}

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-ubuntu-${{ matrix.ubuntu_version }}-${{ matrix.ghc }}-${{ matrix.build_type }}
        path: |
          dist-newstyle
          .stack-work
        retention-days: 1

  # macOS jobs
  macos-build:
    name: Build (macOS ${{ matrix.macos_version }}, GHC ${{ matrix.ghc }})
    runs-on: macos-${{ matrix.macos_version }}
    timeout-minutes: 60
    env:
      GHC_VERSION: ${{ matrix.ghc }}
    strategy:
      matrix:
        macos_version: [13, 14, 15]
        ghc: [9.6.6]
        build_type: [release]
        include:
          - macos_version: 14
            ghc: 9.4.8
            build_type: test
          - macos_version: 14
            ghc: 9.8.4
            build_type: test
          - macos_version: 14
            ghc: 9.10.1
            build_type: test
          - macos_version: 14
            ghc: 9.12.1
            build_type: test

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Cache GHC
      uses: actions/cache@v4
      id: cache-ghc
      with:
        path: |
          ~/.ghcup
          ~/.cabal/store
          ~/.cabal/packages
        key: macos-${{ matrix.macos_version }}-ghc-${{ matrix.ghc }}-${{ hashFiles('**/*.cabal') }}

    - name: Cache build artifacts
      uses: actions/cache@v4
      id: cache-build
      with:
        path: |
          dist-newstyle
          .stack-work
        key: macos-${{ matrix.macos_version }}-build-${{ matrix.ghc }}-${{ hashFiles('**/*.hs', '**/*.cabal', '**/*.hsc', '**/*.h', '**/*.c', '**/*.cpp') }}

    - name: Cache ccache
      uses: actions/cache@v4
      id: cache-ccache
      with:
        path: /tmp/ccache
        key: macos-${{ matrix.macos_version }}-ccache-${{ matrix.ghc }}-${{ hashFiles('**/*.c', '**/*.cpp', '**/*.h') }}

    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: macos-${{ matrix.macos_version }}-ccache-${{ matrix.ghc }}
        max-size: 500M

    - name: Install system dependencies
      run: |
        brew update
        brew install gmp z3

    - name: Setup GHC
      uses: haskell/actions/setup@v2
      with:
        ghc-version: ${{ matrix.ghc }}
        cabal-version: ${{ env.CABAL_VERSION }}
        stack-version: ${{ env.STACK_VERSION }}
        stack-no-global: true
        stack-setup-ghc: true
        enable-stack: true

    - name: Cache Haskell dependencies
      uses: actions/cache@v4
      id: cache-deps
      with:
        path: |
          ~/.cabal/store
          ~/.stack
          dist-newstyle
        key: macos-${{ matrix.macos_version }}-deps-${{ matrix.ghc }}-${{ hashFiles('**/*.cabal') }}

    - name: Install Haskell dependencies
      run: |
        cabal update
        cabal build --only-dependencies -j${{ env.CABAL_JOBS }}

    - name: Build
      run: |
        make -j${{ env.MAKE_JOBS }} GHCJOBS=${{ env.GHCJOBS }} CABAL_JOBS=${{ env.CABAL_JOBS }}

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-macos-${{ matrix.macos_version }}-${{ matrix.ghc }}-${{ matrix.build_type }}
        path: |
          dist-newstyle
          .stack-work
        retention-days: 1

  # Test jobs for Ubuntu
  ubuntu-test:
    name: Test (Ubuntu ${{ matrix.ubuntu_version }}, GHC ${{ matrix.ghc }})
    needs: ubuntu-build
    runs-on: ubuntu-${{ matrix.ubuntu_version }}
    timeout-minutes: 30
    strategy:
      matrix:
        ubuntu_version: [20.04, 22.04, 24.04]
        ghc: [9.6.6]
        build_type: [release]
        include:
          - ubuntu_version: 22.04
            ghc: 9.4.8
            build_type: test
          - ubuntu_version: 22.04
            ghc: 9.8.4
            build_type: test
          - ubuntu_version: 22.04
            ghc: 9.10.1
            build_type: test
          - ubuntu_version: 22.04
            ghc: 9.12.1
            build_type: test

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: build-ubuntu-${{ matrix.ubuntu_version }}-${{ matrix.ghc }}-${{ matrix.build_type }}
        path: .

    - name: Cache GHC
      uses: actions/cache@v4
      id: cache-ghc
      with:
        path: |
          ~/.ghcup
          ~/.cabal/store
          ~/.cabal/packages
        key: ubuntu-${{ matrix.ubuntu_version }}-ghc-${{ matrix.ghc }}-${{ hashFiles('**/*.cabal') }}

    - name: Setup GHC
      uses: haskell/actions/setup@v2
      with:
        ghc-version: ${{ matrix.ghc }}
        cabal-version: ${{ env.CABAL_VERSION }}
        stack-version: ${{ env.STACK_VERSION }}
        stack-no-global: true
        stack-setup-ghc: true
        enable-stack: true

    - name: Run smoke tests
      run: |
        make -j${{ env.MAKE_JOBS }} smoke-tests

  # Test jobs for macOS
  macos-test:
    name: Test (macOS ${{ matrix.macos_version }}, GHC ${{ matrix.ghc }})
    needs: macos-build
    runs-on: macos-${{ matrix.macos_version }}
    timeout-minutes: 30
    strategy:
      matrix:
        macos_version: [13, 14, 15]
        ghc: [9.6.6]
        build_type: [release]
        include:
          - macos_version: 14
            ghc: 9.4.8
            build_type: test
          - macos_version: 14
            ghc: 9.8.4
            build_type: test
          - macos_version: 14
            ghc: 9.10.1
            build_type: test
          - macos_version: 14
            ghc: 9.12.1
            build_type: test

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: build-macos-${{ matrix.macos_version }}-${{ matrix.ghc }}-${{ matrix.build_type }}
        path: .

    - name: Cache GHC
      uses: actions/cache@v4
      id: cache-ghc
      with:
        path: |
          ~/.ghcup
          ~/.cabal/store
          ~/.cabal/packages
        key: macos-${{ matrix.macos_version }}-ghc-${{ matrix.ghc }}-${{ hashFiles('**/*.cabal') }}

    - name: Setup GHC
      uses: haskell/actions/setup@v2
      with:
        ghc-version: ${{ matrix.ghc }}
        cabal-version: ${{ env.CABAL_VERSION }}
        stack-version: ${{ env.STACK_VERSION }}
        stack-no-global: true
        stack-setup-ghc: true
        enable-stack: true

    - name: Run smoke tests
      run: |
        make -j${{ env.MAKE_JOBS }} smoke-tests

  # HLS jobs for Ubuntu
  ubuntu-hls:
    name: HLS (Ubuntu ${{ matrix.ubuntu_version }}, GHC ${{ matrix.ghc }})
    needs: ubuntu-build
    runs-on: ubuntu-${{ matrix.ubuntu_version }}
    timeout-minutes: 20
    strategy:
      matrix:
        ubuntu_version: [20.04, 22.04, 24.04]
