name: Matrix Build and Test

on:
  push:
    branches: [ main ]
    paths:
      - '**.hs'
      - '**.cabal'
      - '**.c'
      - '**.cpp'
      - '**.h'
      - '**.hsc'
      - 'Makefile'
      - '.github/workflows/**'
  pull_request:
    branches: [ main ]
    paths:
      - '**.hs'
      - '**.cabal'
      - '**.c'
      - '**.cpp'
      - '**.h'
      - '**.hsc'
      - 'Makefile'
      - '.github/workflows/**'
  workflow_dispatch:

env:
  CABAL_VERSION: "3.10.2.1"
  STACK_VERSION: "2.13.1"
  CCACHE_DIR: /tmp/ccache
  CCACHE_MAXSIZE: 500M
  CCACHE_COMPRESS: 1
  CCACHE_COMPRESSLEVEL: 6
  CCACHE_HARDLINK: 1
  CCACHE_SLOPPINESS: file_macro,time_macros,include_file_mtime,include_file_ctime,file_stat_matches,file_stat_matches_ctime,pch_defines,modules,ivars
  GHCJOBS: $(nproc)
  CABAL_JOBS: $(nproc)
  MAKE_JOBS: $(nproc)
  CABAL_TEST_JOBS: $(nproc)
  COMMON_DEPENDENCIES: "aeson async attoparsec base bytestring case-insensitive containers deepseq directory exceptions filepath hashable http-client http-conduit http-types lens mtl network optparse-applicative process random scientific stm streaming text time transformers unix unordered-containers vector wai wai-extra warp"

jobs:
  # Ubuntu group
  ubuntu-group:
    name: Ubuntu Group
    runs-on: ubuntu-latest
    needs: []
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup
      run: echo "Starting Ubuntu jobs"

  # Ubuntu build jobs
  ubuntu-build:
    name: Build (Ubuntu ${{ matrix.os_version }}, GHC ${{ matrix.ghc_version }})
    needs: ubuntu-group
    runs-on: ubuntu-${{ matrix.os_version }}
    timeout-minutes: 60
    env:
      GHC_VERSION: ${{ matrix.ghc_version }}
      CABAL_BUILD_OPTIONS: "--ghc-options=-j$(nproc) --enable-tests --enable-benchmarks --enable-optimization=2 --disable-library-profiling --enable-executable-stripping --disable-documentation"

    strategy:
      fail-fast: false
      matrix:
        os_version: [20.04, 22.04, 24.04]
        ghc_version: [9.6.6]
        build_type: [release]
        include:
          - os_version: 22.04
            ghc_version: 9.4.8
            build_type: test
          - os_version: 22.04
            ghc_version: 9.8.4
            build_type: test
          - os_version: 22.04
            ghc_version: 9.10.1
            build_type: test
          - os_version: 22.04
            ghc_version: 9.12.1
            build_type: test

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Cache Docker layers
      uses: actions/cache@v4
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-docker-${{ matrix.os_version }}-${{ matrix.ghc_version }}-${{ hashFiles(format('.github/workflows/Dockerfile.ubuntu-{0}', matrix.os_version)) }}
        restore-keys: |
          ${{ runner.os }}-docker-${{ matrix.os_version }}-${{ matrix.ghc_version }}-
          ${{ runner.os }}-docker-${{ matrix.os_version }}-

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: .github/workflows/Dockerfile.ubuntu-${{ matrix.os_version }}
        push: false
        load: true
        tags: ghcr.io/${{ github.repository }}/ubuntu-${{ matrix.os_version }}:${{ matrix.ghc_version }}
        cache-from: type=local,src=/tmp/.buildx-cache
        cache-to: type=local,dest=/tmp/.buildx-cache-new
        build-args: |
          GHC_VERSION=${{ matrix.ghc_version }}
          CABAL_VERSION=${{ env.CABAL_VERSION }}
          STACK_VERSION=${{ env.STACK_VERSION }}

    - name: Move cache
      run: |
        rm -rf /tmp/.buildx-cache
        mv /tmp/.buildx-cache-new /tmp/.buildx-cache

    - name: Cache Haskell dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cabal/store
          ~/.stack
          dist-newstyle
          /opt/cabal-store
          /opt/stack
        key: ${{ runner.os }}-${{ matrix.os_version }}-deps-${{ matrix.ghc_version }}-${{ hashFiles('**/*.cabal') }}-${{ hashFiles('cabal.project') }}-${{ hashFiles('**/*.hs') }}-${{ hashFiles('**/*.c', '**/*.cpp', '**/*.h') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.os_version }}-deps-${{ matrix.ghc_version }}-
          ${{ runner.os }}-${{ matrix.os_version }}-deps-

    - name: Cache ccache
      uses: actions/cache@v4
      with:
        path: /tmp/ccache
        key: ${{ runner.os }}-${{ matrix.os_version }}-ccache-${{ matrix.ghc_version }}-${{ hashFiles('**/*.c', '**/*.cpp', '**/*.h') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.os_version }}-ccache-${{ matrix.ghc_version }}-
          ${{ runner.os }}-${{ matrix.os_version }}-ccache-

    - name: Cache package indices
      uses: actions/cache@v4
      with:
        path: |
          ~/.cabal/packages
          ~/.stack/indices
        key: ${{ runner.os }}-${{ matrix.os_version }}-indices-${{ matrix.ghc_version }}-${{ hashFiles('**/*.cabal') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.os_version }}-indices-${{ matrix.ghc_version }}-
          ${{ runner.os }}-${{ matrix.os_version }}-indices-

    - name: Run in Docker container
      run: |
        docker run --rm \
          -v $(pwd):/work \
          -v /tmp/ccache:/tmp/ccache \
          -e GHC_VERSION=${{ matrix.ghc_version }} \
          -e CABAL_BUILD_OPTIONS="${{ env.CABAL_BUILD_OPTIONS }}" \
          -e CCACHE_DIR=/tmp/ccache \
          -e CCACHE_MAXSIZE=500M \
          -e CCACHE_COMPRESS=1 \
          -e CCACHE_COMPRESSLEVEL=6 \
          -e CCACHE_HARDLINK=1 \
          -e CCACHE_SLOPPINESS="${{ env.CCACHE_SLOPPINESS }}" \
          -e GHCJOBS=${{ env.GHCJOBS }} \
          -e CABAL_JOBS=${{ env.CABAL_JOBS }} \
          -e MAKE_JOBS=${{ env.MAKE_JOBS }} \
          ghcr.io/${{ github.repository }}/ubuntu-${{ matrix.os_version }}:${{ matrix.ghc_version }} \
          bash -c "cabal update && cabal build ${{ env.CABAL_BUILD_OPTIONS }}"

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-ubuntu-${{ matrix.os_version }}-${{ matrix.ghc_version }}-${{ matrix.build_type }}
        path: |
          dist-newstyle
          .stack-work
        retention-days: 1
        compression-level: 9

  # Ubuntu test jobs
  ubuntu-test:
    name: Test (Ubuntu ${{ matrix.os_version }}, GHC ${{ matrix.ghc_version }})
    needs: ubuntu-build
    runs-on: ubuntu-${{ matrix.os_version }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os_version: [20.04, 22.04, 24.04]
        ghc_version: [9.6.6]
        build_type: [release]
        include:
          - os_version: 22.04
            ghc_version: 9.4.8
            build_type: test
          - os_version: 22.04
            ghc_version: 9.8.4
            build_type: test
          - os_version: 22.04
            ghc_version: 9.10.1
            build_type: test
          - os_version: 22.04
            ghc_version: 9.12.1
            build_type: test

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: build-ubuntu-${{ matrix.os_version }}-${{ matrix.ghc_version }}-${{ matrix.build_type }}
        path: .

    - name: Cache GHC
      uses: actions/cache@v4
      id: cache-ghc
      with:
        path: |
          ~/.ghcup
          ~/.cabal/store
          ~/.cabal/packages
        key: ${{ runner.os }}-${{ matrix.os_version }}-ghc-${{ matrix.ghc_version }}-${{ hashFiles('**/*.cabal') }}-${{ hashFiles('cabal.project') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.os_version }}-ghc-${{ matrix.ghc_version }}-

    - name: Setup GHC
      uses: haskell/actions/setup@v2
      with:
        ghc-version: ${{ matrix.ghc_version }}
        cabal-version: ${{ env.CABAL_VERSION }}
        stack-version: ${{ env.STACK_VERSION }}
        stack-no-global: true
        stack-setup-ghc: true
        enable-stack: true

    - name: Run smoke tests
      run: |
        cabal test -j${{ env.CABAL_TEST_JOBS }} --test-show-details=direct --test-option=--num-threads=${{ env.CABAL_TEST_JOBS }}

  # Ubuntu HLS jobs
  ubuntu-hls:
    name: HLS (Ubuntu ${{ matrix.os_version }}, GHC ${{ matrix.ghc_version }})
    needs: ubuntu-build
    runs-on: ubuntu-${{ matrix.os_version }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os_version: [20.04, 22.04, 24.04]
        ghc_version: [9.6.6]
        build_type: [release]
        include:
          - os_version: 22.04
            ghc_version: 9.4.8
            build_type: test
          - os_version: 22.04
            ghc_version: 9.8.4
            build_type: test
          - os_version: 22.04
            ghc_version: 9.10.1
            build_type: test
          - os_version: 22.04
            ghc_version: 9.12.1
            build_type: test

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: build-ubuntu-${{ matrix.os_version }}-${{ matrix.ghc_version }}-${{ matrix.build_type }}
        path: .

    - name: Cache GHC
      uses: actions/cache@v4
      id: cache-ghc
      with:
        path: |
          ~/.ghcup
          ~/.cabal/store
          ~/.cabal/packages
        key: ${{ runner.os }}-${{ matrix.os_version }}-ghc-${{ matrix.ghc_version }}-${{ hashFiles('**/*.cabal') }}-${{ hashFiles('cabal.project') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.os_version }}-ghc-${{ matrix.ghc_version }}-

    - name: Setup GHC
      uses: haskell/actions/setup@v2
      with:
        ghc-version: ${{ matrix.ghc_version }}
        cabal-version: ${{ env.CABAL_VERSION }}
        stack-version: ${{ env.STACK_VERSION }}
        stack-no-global: true
        stack-setup-ghc: true
        enable-stack: true

    - name: Test HLS
      if: matrix.ghc_version != '9.12.1'
      run: |
        make -j${{ env.MAKE_JOBS }} test-hls

  # Ubuntu GHCI jobs
  ubuntu-ghci:
    name: GHCI (Ubuntu ${{ matrix.os_version }}, GHC ${{ matrix.ghc_version }})
    needs: ubuntu-build
    runs-on: ubuntu-${{ matrix.os_version }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os_version: [20.04, 22.04, 24.04]
        ghc_version: [9.6.6]
        build_type: [release]
        include:
          - os_version: 22.04
            ghc_version: 9.4.8
            build_type: test
          - os_version: 22.04
            ghc_version: 9.8.4
            build_type: test
          - os_version: 22.04
            ghc_version: 9.10.1
            build_type: test
          - os_version: 22.04
            ghc_version: 9.12.1
            build_type: test

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: build-ubuntu-${{ matrix.os_version }}-${{ matrix.ghc_version }}-${{ matrix.build_type }}
        path: .

    - name: Cache GHC
      uses: actions/cache@v4
      id: cache-ghc
      with:
        path: |
          ~/.ghcup
          ~/.cabal/store
          ~/.cabal/packages
        key: ${{ runner.os }}-${{ matrix.os_version }}-ghc-${{ matrix.ghc_version }}-${{ hashFiles('**/*.cabal') }}-${{ hashFiles('cabal.project') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.os_version }}-ghc-${{ matrix.ghc_version }}-

    - name: Setup GHC
      uses: haskell/actions/setup@v2
      with:
        ghc-version: ${{ matrix.ghc_version }}
        cabal-version: ${{ env.CABAL_VERSION }}
        stack-version: ${{ env.STACK_VERSION }}
        stack-no-global: true
        stack-setup-ghc: true
        enable-stack: true

    - name: Check GHCI load
      run: |
        make -j${{ env.MAKE_JOBS }} test-ghci

  # macOS group
  macos-group:
    name: macOS Group
    runs-on: macos-latest
    needs: []
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup
      run: echo "Starting macOS jobs"

  # macOS build jobs
  macos-build:
    name: Build (macOS ${{ matrix.os_version }}, GHC ${{ matrix.ghc_version }})
    needs: macos-group
    runs-on: macos-${{ matrix.os_version }}
    timeout-minutes: 60
    env:
      GHC_VERSION: ${{ matrix.ghc_version }}

    strategy:
      fail-fast: false
      matrix:
        os_version: [13, 14, 15]
        ghc_version: [9.6.6]
        build_type: [release]
        include:
          - os_version: 14
            ghc_version: 9.4.8
            build_type: test
          - os_version: 14
            ghc_version: 9.8.4
            build_type: test
          - os_version: 14
            ghc_version: 9.10.1
            build_type: test
          - os_version: 14
            ghc_version: 9.12.1
            build_type: test

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Cache GHC
      uses: actions/cache@v4
      id: cache-ghc
      with:
        path: |
          ~/.ghcup
          ~/.cabal/store
          ~/.cabal/packages
        key: macos-${{ matrix.os_version }}-ghc-${{ matrix.ghc_version }}-${{ hashFiles('**/*.cabal') }}-${{ hashFiles('cabal.project') }}
        restore-keys: |
          macos-${{ matrix.os_version }}-ghc-${{ matrix.ghc_version }}-

    - name: Cache build artifacts
      uses: actions/cache@v4
      id: cache-build
      with:
        path: |
          dist-newstyle
          .stack-work
        key: macos-${{ matrix.os_version }}-build-${{ matrix.ghc_version }}-${{ hashFiles('**/*.hs', '**/*.cabal', '**/*.hsc', '**/*.h', '**/*.c', '**/*.cpp') }}
        restore-keys: |
          macos-${{ matrix.os_version }}-build-${{ matrix.ghc_version }}-

    - name: Cache ccache
      uses: actions/cache@v4
      id: cache-ccache
      with:
        path: /tmp/ccache
        key: macos-${{ matrix.os_version }}-ccache-${{ matrix.ghc_version }}-${{ hashFiles('**/*.c', '**/*.cpp', '**/*.h') }}
        restore-keys: |
          macos-${{ matrix.os_version }}-ccache-${{ matrix.ghc_version }}-

    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: macos-${{ matrix.os_version }}-ccache-${{ matrix.ghc_version }}
        max-size: 500M

    - name: Install system dependencies
      run: |
        brew update
        brew install gmp z3

    - name: Setup GHC
      uses: haskell/actions/setup@v2
      with:
        ghc-version: ${{ matrix.ghc_version }}
        cabal-version: ${{ env.CABAL_VERSION }}
        stack-version: ${{ env.STACK_VERSION }}
        stack-no-global: true
        stack-setup-ghc: true
        enable-stack: true

    - name: Cache Haskell dependencies
      uses: actions/cache@v4
      id: cache-deps
      with:
        path: |
          ~/.cabal/store
          ~/.stack
          dist-newstyle
        key: macos-${{ matrix.os_version }}-deps-${{ matrix.ghc_version }}-${{ hashFiles('**/*.cabal') }}-${{ hashFiles('cabal.project') }}
        restore-keys: |
          macos-${{ matrix.os_version }}-deps-${{ matrix.ghc_version }}-

    - name: Install Haskell dependencies
      run: |
        cabal update
        cabal build --only-dependencies -j${{ env.CABAL_JOBS }}

    - name: Build
      run: |
        make -j${{ env.MAKE_JOBS }} GHCJOBS=${{ env.GHCJOBS }} CABAL_JOBS=${{ env.CABAL_JOBS }}

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-macos-${{ matrix.os_version }}-${{ matrix.ghc_version }}-${{ matrix.build_type }}
        path: |
          dist-newstyle
          .stack-work
        retention-days: 1
        compression-level: 9

  # macOS test jobs
  macos-test:
    name: Test (macOS ${{ matrix.os_version }}, GHC ${{ matrix.ghc_version }})
    needs: macos-build
    runs-on: macos-${{ matrix.os_version }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os_version: [13, 14, 15]
        ghc_version: [9.6.6]
        build_type: [release]
        include:
          - os_version: 14
            ghc_version: 9.4.8
            build_type: test
          - os_version: 14
            ghc_version: 9.8.4
            build_type: test
          - os_version: 14
            ghc_version: 9.10.1
            build_type: test
          - os_version: 14
            ghc_version: 9.12.1
            build_type: test

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: build-macos-${{ matrix.os_version }}-${{ matrix.ghc_version }}-${{ matrix.build_type }}
        path: .

    - name: Cache GHC
      uses: actions/cache@v4
      id: cache-ghc
      with:
        path: |
          ~/.ghcup
          ~/.cabal/store
          ~/.cabal/packages
        key: macos-${{ matrix.os_version }}-ghc-${{ matrix.ghc_version }}-${{ hashFiles('**/*.cabal') }}-${{ hashFiles('cabal.project') }}
        restore-keys: |
          macos-${{ matrix.os_version }}-ghc-${{ matrix.ghc_version }}-

    - name: Setup GHC
      uses: haskell/actions/setup@v2
      with:
        ghc-version: ${{ matrix.ghc_version }}
        cabal-version: ${{ env.CABAL_VERSION }}
        stack-version: ${{ env.STACK_VERSION }}
        stack-no-global: true
        stack-setup-ghc: true
        enable-stack: true

    - name: Run smoke tests
      run: |
        make -j${{ env.MAKE_JOBS }} smoke-tests

  # macOS HLS jobs
  macos-hls:
    name: HLS (macOS ${{ matrix.os_version }}, GHC ${{ matrix.ghc_version }})
    needs: macos-build
    runs-on: macos-${{ matrix.os_version }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os_version: [13, 14, 15]
        ghc_version: [9.6.6]
        build_type: [release]
        include:
          - os_version: 14
            ghc_version: 9.4.8
            build_type: test
          - os_version: 14
            ghc_version: 9.8.4
            build_type: test
          - os_version: 14
            ghc_version: 9.10.1
            build_type: test
          - os_version: 14
            ghc_version: 9.12.1
            build_type: test

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: build-macos-${{ matrix.os_version }}-${{ matrix.ghc_version }}-${{ matrix.build_type }}
        path: .

    - name: Cache GHC
      uses: actions/cache@v4
      id: cache-ghc
      with:
        path: |
          ~/.ghcup
          ~/.cabal/store
          ~/.cabal/packages
        key: macos-${{ matrix.os_version }}-ghc-${{ matrix.ghc_version }}-${{ hashFiles('**/*.cabal') }}-${{ hashFiles('cabal.project') }}
        restore-keys: |
          macos-${{ matrix.os_version }}-ghc-${{ matrix.ghc_version }}-

    - name: Setup GHC
      uses: haskell/actions/setup@v2
      with:
        ghc-version: ${{ matrix.ghc_version }}
        cabal-version: ${{ env.CABAL_VERSION }}
        stack-version: ${{ env.STACK_VERSION }}
        stack-no-global: true
        stack-setup-ghc: true
        enable-stack: true

    - name: Test HLS
      if: matrix.ghc_version != '9.12.1'
      run: |
        make -j${{ env.MAKE_JOBS }} test-hls

  # macOS GHCI jobs
  macos-ghci:
    name: GHCI (macOS ${{ matrix.os_version }}, GHC ${{ matrix.ghc_version }})
    needs: macos-build
    runs-on: macos-${{ matrix.os_version }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os_version: [13, 14, 15]
        ghc_version: [9.6.6]
        build_type: [release]
        include:
          - os_version: 14
            ghc_version: 9.4.8
            build_type: test
          - os_version: 14
            ghc_version: 9.8.4
            build_type: test
          - os_version: 14
            ghc_version: 9.10.1
            build_type: test
          - os_version: 14
            ghc_version: 9.12.1
            build_type: test

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: build-macos-${{ matrix.os_version }}-${{ matrix.ghc_version }}-${{ matrix.build_type }}
        path: .

    - name: Cache GHC
      uses: actions/cache@v4
      id: cache-ghc
      with:
        path: |
          ~/.ghcup
          ~/.cabal/store
          ~/.cabal/packages
        key: macos-${{ matrix.os_version }}-ghc-${{ matrix.ghc_version }}-${{ hashFiles('**/*.cabal') }}-${{ hashFiles('cabal.project') }}
        restore-keys: |
          macos-${{ matrix.os_version }}-ghc-${{ matrix.ghc_version }}-

    - name: Setup GHC
      uses: haskell/actions/setup@v2
      with:
        ghc-version: ${{ matrix.ghc_version }}
        cabal-version: ${{ env.CABAL_VERSION }}
        stack-version: ${{ env.STACK_VERSION }}
        stack-no-global: true
        stack-setup-ghc: true
        enable-stack: true

    - name: Check GHCI load
      run: |
        make -j${{ env.MAKE_JOBS }} test-ghci

    - name: Create cabal.project
      run: |
        cat > cabal.project << EOF
        packages: .
        tests: True
        benchmarks: True
        optimization: 2
        documentation: False
        tests-show-details: direct
        tests-show-log: True
        tests-keep-tix: True
        tests-keep-going: True
        tests-jobs: ${{ env.CABAL_TEST_JOBS }}
        EOF 