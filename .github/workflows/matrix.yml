    needs: ubuntu-build
    runs-on: ubuntu-${{ matrix.ubuntu_version }}
    timeout-minutes: 20
    strategy:
      matrix:
        ubuntu_version: [20.04, 22.04, 24.04]
        ghc: [9.6.6]
        build_type: [release]
        include:
          - ubuntu_version: 22.04
            ghc: 9.4.8
            build_type: test
          - ubuntu_version: 22.04
            ghc: 9.8.4
            build_type: test
          - ubuntu_version: 22.04
            ghc: 9.10.1
            build_type: test
          - ubuntu_version: 22.04
            ghc: 9.12.1
            build_type: test

    steps:
    - uses: actions/checkout@v4
      with:
