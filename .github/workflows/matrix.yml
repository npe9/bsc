        key: ${{ runner.os }}-${{ matrix.os_version }}-ghc-${{ matrix.ghc_version }}-${{ hashFiles('**/*.cabal') }}-${{ hashFiles('cabal.project') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.os_version }}-ghc-${{ matrix.ghc_version }}-

    - name: Setup GHC
      uses: haskell/actions/setup@v2.0.0
      with:
        ghc-version: ${{ matrix.ghc_version }}
        cabal-version: ${{ env.CABAL_VERSION }}
        stack-version: ${{ env.STACK_VERSION }}
        stack-no-global: true
        stack-setup-ghc: true
        enable-stack: true

    - name: Test HLS
      if: matrix.ghc_version != '9.12.1'
      run: |
        make -j${{ env.MAKE_JOBS }} test-hls

  # Ubuntu GHCI jobs
  ubuntu-ghci:
    name: GHCI (Ubuntu ${{ matrix.os_version }}, GHC ${{ matrix.ghc_version }})
    needs: ubuntu-build
    runs-on: ubuntu-${{ matrix.os_version }}
    timeout-minutes: 20
    strategy:
