name: Matrix Build and Test

on:
  push:
    branches: [ main, runner-matrix ]
    paths:
      - '**.hs'
      - '**.cabal'
      - '**.c'
      - '**.cpp'
      - '**.h'
      - '**.hsc'
      - 'Makefile'
      - '.github/workflows/**'
      - 'Dockerfile*'
      - '**/Dockerfile*'
  pull_request:
    branches: [ main ]
    paths:
      - '**.hs'
      - '**.cabal'
      - '**.c'
      - '**.cpp'
      - '**.h'
      - '**.hsc'
      - 'Makefile'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  actions: write
  id-token: write

env:
  CABAL_VERSION: "3.10.2.1"
  STACK_VERSION: "2.11.1"
  CCACHE_DIR: /tmp/ccache
  CCACHE_MAXSIZE: 500M
  CCACHE_COMPRESS: 1
  CCACHE_COMPRESSLEVEL: 6
  CCACHE_HARDLINK: 1
  CCACHE_SLOPPINESS: file_macro,time_macros,include_file_mtime,include_file_ctime,file_stat_matches,file_stat_matches_ctime,pch_defines,modules,ivars
  GHCJOBS: $(nproc)
  CABAL_JOBS: $(nproc)
  MAKE_JOBS: $(nproc)
  CABAL_TEST_JOBS: $(nproc)
  COMMON_DEPENDENCIES: "aeson async attoparsec base bytestring case-insensitive containers deepseq directory exceptions filepath hashable http-client http-conduit http-types lens mtl network optparse-applicative process random scientific stm streaming text time transformers unix unordered-containers vector wai wai-extra warp"

jobs:
  # Ubuntu jobs
  ubuntu:
    name: Ubuntu
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v3
      with:
        token: ${{ secrets.WORKFLOW_PAT }}
    - name: Setup
      run: echo "Starting Ubuntu jobs"

  # Ubuntu build jobs
  ubuntu-build:
    name: Build (Ubuntu ${{ matrix.os_version }}, GHC ${{ matrix.ghc_version }})
    needs: ubuntu
    runs-on: ubuntu-${{ matrix.os_version }}
    timeout-minutes: 60
    env:
      GHC_VERSION: ${{ matrix.ghc_version }}
      CABAL_BUILD_OPTIONS: "--ghc-options=-j$(nproc) --enable-tests --enable-benchmarks --enable-optimization=2 --disable-library-profiling --enable-executable-stripping --disable-documentation"

    strategy:
      fail-fast: false
      matrix:
        os_version: [22.04, 24.04]
        ghc_version: [9.6.6]
        build_type: [release]
        include:
          - os_version: 22.04
            ghc_version: 9.4.8
            build_type: test
          - os_version: 22.04
            ghc_version: 9.8.4
            build_type: test
          - os_version: 22.04
            ghc_version: 9.10.1
            build_type: test
          - os_version: 22.04
            ghc_version: 9.12.1
            build_type: test

    steps:
    - uses: actions/checkout@v3
      with:
        token: ${{ secrets.WORKFLOW_PAT }}
        fetch-depth: 0
        submodules: recursive

    - name: Cache GHC
      uses: actions/cache@v3
      id: cache-ghc
      with:
        path: |
          ~/.ghcup
          ~/.cabal/store
          ~/.cabal/packages
        key: ${{ runner.os }}-${{ matrix.os_version }}-ghc-${{ matrix.ghc_version }}-${{ hashFiles('**/*.cabal') }}-${{ hashFiles('cabal.project') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.os_version }}-ghc-${{ matrix.ghc_version }}-

    - name: Setup GHC
      uses: haskell/actions/setup@v2.0.0
      with:
        ghc-version: ${{ matrix.ghc_version }}
        cabal-version: ${{ env.CABAL_VERSION }}
        stack-version: ${{ env.STACK_VERSION }}
        stack-no-global: true
        stack-setup-ghc: true
        enable-stack: true

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgmp-dev libz3-dev

    - name: Build
      run: |
        cabal update
        cabal build ${{ env.CABAL_BUILD_OPTIONS }}

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4.3.1
      with:
        name: build-ubuntu-${{ matrix.os_version }}-${{ matrix.ghc_version }}-${{ matrix.build_type }}
        path: |
          dist-newstyle
          .stack-work
        retention-days: 1
        compression-level: 9

  # Ubuntu test jobs
  ubuntu-test:
    name: Test (Ubuntu ${{ matrix.os_version }}, GHC ${{ matrix.ghc_version }})
    needs: ubuntu-build
    runs-on: ubuntu-${{ matrix.os_version }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os_version: [22.04, 24.04]
        ghc_version: [9.6.6]
        build_type: [release]
        include:
          - os_version: 22.04
            ghc_version: 9.4.8
            build_type: test
          - os_version: 22.04
            ghc_version: 9.8.4
            build_type: test
          - os_version: 22.04
            ghc_version: 9.10.1
            build_type: test
          - os_version: 22.04
            ghc_version: 9.12.1
            build_type: test

    steps:
    - uses: actions/checkout@v3
