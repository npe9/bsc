name: Matrix Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Release builds - most stable GHC version
          - os: ubuntu-20.04
            ghc: 9.6.6
            build_type: release
          - os: ubuntu-22.04
            ghc: 9.6.6
            build_type: release
          - os: ubuntu-24.04
            ghc: 9.6.6
            build_type: release
          - os: macos-13
            ghc: 9.6.6
            build_type: release
          - os: macos-14
            ghc: 9.6.6
            build_type: release
          - os: macos-15
            ghc: 9.6.6
            build_type: release
          # Test builds - newer GHC versions
          - os: ubuntu-22.04
            ghc: 9.4.8
            build_type: test
          - os: ubuntu-22.04
            ghc: 9.8.4
            build_type: test
          - os: ubuntu-22.04
            ghc: 9.10.1
            build_type: test
          - os: ubuntu-22.04
            ghc: 9.12.1
            build_type: test
          - os: macos-14
            ghc: 9.4.8
            build_type: test
          - os: macos-14
            ghc: 9.8.4
            build_type: test
          - os: macos-14
            ghc: 9.10.1
            build_type: test
          - os: macos-14
            ghc: 9.12.1
            build_type: test

    name: Build ${{ matrix.os }} / ghc-${{ matrix.ghc }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache GHC and Cabal
        uses: actions/cache@v4
        with:
          path: |
            ~/.ghcup
            ~/.cabal
          key: ${{ runner.os }}-ghc-${{ matrix.ghc }}-cabal-${{ hashFiles('**/*.cabal') }}
          restore-keys: |
            ${{ runner.os }}-ghc-${{ matrix.ghc }}-cabal-

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/ccache
          key: ${{ runner.os }}-ccache-${{ matrix.ghc }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ matrix.ghc }}-

      - name: Setup ccache
        run: |
          mkdir -p ccache
          echo "CCACHE_DIR=${{ github.workspace }}/ccache" >> $GITHUB_ENV
          echo "CCACHE_MAXSIZE=500M" >> $GITHUB_ENV

      - name: Install system dependencies (Ubuntu)
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo .github/workflows/install_dependencies_ubuntu.sh

      - name: Install system dependencies (macOS)
        if: startsWith(matrix.os, 'macos')
        run: .github/workflows/install_dependencies_macos.sh

      - name: Setup GHC
        run: |
          if ! command -v ghcup &> /dev/null; then
            if [ "${{ runner.os }}" = "macOS" ]; then
              curl --proto '=https' --tlsv1.2 -sSf https://get-ghcup.haskell.org | sh
              echo "$HOME/.ghcup/bin" >> $GITHUB_PATH
            else
              export BOOTSTRAP_HASKELL_NONINTERACTIVE=1
              curl --proto '=https' --tlsv1.2 -sSf https://get-ghcup.haskell.org | sh
            fi
          fi
          ghcup install ghc ${{ matrix.ghc }}
          ghcup set ghc ${{ matrix.ghc }}

      - name: Install Haskell dependencies
        run: |
          cabal update
          # Use parallel installation
          cabal v1-install -j$(nproc) old-time regex-compat split syb

      - name: Build
        env:
          CCACHE_DIR: ${{ github.workspace }}/ccache
        run: |
          ccache --zero-stats --max-size 500M
          export PATH=/usr/lib/ccache:$PATH
          # Use maximum available cores for both make and GHC
          make -j$(nproc) GHCJOBS=$(nproc) GHCRTSFLAGS='+RTS -M5G -A128m -N$(nproc) -RTS' install-src
          tar czf inst.tar.gz inst

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bsc-${{ matrix.os }}-ghc${{ matrix.ghc }}
          path: inst.tar.gz
          retention-days: 7

  test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-20.04
            ghc: 9.6.6
          - os: ubuntu-22.04
            ghc: 9.6.6
          - os: ubuntu-24.04
            ghc: 9.6.6
          - os: macos-13
            ghc: 9.6.6
          - os: macos-14
            ghc: 9.6.6
          - os: macos-15
            ghc: 9.6.6

    name: Test ${{ matrix.os }} / ghc-${{ matrix.ghc }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: bsc-${{ matrix.os }}-ghc${{ matrix.ghc }}

      - name: Extract artifacts
        run: tar xzf inst.tar.gz

      - name: Run smoke tests
        run: make -j$(nproc) check-smoke

  hls:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            ghc: 9.6.6
            hls: 2.9.0.1
          - os: ubuntu-22.04
            ghc: 9.4.8
            hls: 2.9.0.1
          - os: ubuntu-22.04
            ghc: 9.10.1
            hls: 2.9.0.1
          - os: macos-14
            ghc: 9.6.6
            hls: 2.9.0.1
          - os: macos-14
            ghc: 9.4.8
            hls: 2.9.0.1
          - os: macos-14
            ghc: 9.10.1
            hls: 2.9.0.1

    name: HLS ${{ matrix.os }} / ghc-${{ matrix.ghc }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: bsc-${{ matrix.os }}-ghc${{ matrix.ghc }}

      - name: Extract artifacts
        run: tar xzf inst.tar.gz

      - name: Setup GHC and HLS
        run: |
          if ! command -v ghcup &> /dev/null; then
            if [ "${{ runner.os }}" = "macOS" ]; then
              curl --proto '=https' --tlsv1.2 -sSf https://get-ghcup.haskell.org | sh
              echo "$HOME/.ghcup/bin" >> $GITHUB_PATH
            else
              export BOOTSTRAP_HASKELL_NONINTERACTIVE=1
              curl --proto '=https' --tlsv1.2 -sSf https://get-ghcup.haskell.org | sh
            fi
          fi
          ghcup install ghc ${{ matrix.ghc }}
          ghcup set ghc ${{ matrix.ghc }}
          ghcup install hls ${{ matrix.hls }}

      - name: Install dependencies
        run: |
          if [ "${{ startsWith(matrix.os, 'ubuntu') }}" = "true" ]; then
            ubuntu_ver=$(lsb_release -rs | cut -d '.' -f 1)
            if [ "$ubuntu_ver" -ge "24" ]; then
              sudo apt-get update
              sudo apt-get install -y python3-yaml
            else
              pip3 install pyyaml
            fi
          else
            pip3 install pyyaml
          fi

      - name: Test HLS
        run: |
          python3 util/haskell-language-server/gen_hie.py
          cd src/comp
          haskell-language-server-${{ matrix.ghc }} bsc.hs

  ghci:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            ghc: 9.6.6
          - os: macos-14
            ghc: 9.6.6

    name: GHCI ${{ matrix.os }} / ghc-${{ matrix.ghc }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: bsc-${{ matrix.os }}-ghc${{ matrix.ghc }}

      - name: Extract artifacts
        run: tar xzf inst.tar.gz

      - name: Setup GHC
        run: |
          if ! command -v ghcup &> /dev/null; then
            if [ "${{ runner.os }}" = "macOS" ]; then
              curl --proto '=https' --tlsv1.2 -sSf https://get-ghcup.haskell.org | sh
              echo "$HOME/.ghcup/bin" >> $GITHUB_PATH
            else
              export BOOTSTRAP_HASKELL_NONINTERACTIVE=1
              curl --proto '=https' --tlsv1.2 -sSf https://get-ghcup.haskell.org | sh
            fi
          fi
          ghcup install ghc ${{ matrix.ghc }}
          ghcup set ghc ${{ matrix.ghc }}

      - name: Check GHCI load
        run: |
          cd src/comp
          export NOGIT=0
          export NOUPDATEBUILDVERSION=0
          ./update-build-version.sh
          ./update-build-system.sh
          echo ':load bsc.hs' | ghci 2>&1 | tee ghci.log
          if grep -E '(Failed|error:)' ghci.log; then
            echo "GHCi reported errors."
            exit 1
          fi 