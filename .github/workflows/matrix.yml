name: Matrix Build and Test

on:
  push:
    branches: [ main ]
    paths:
      - '**.hs'
      - '**.cabal'
      - '**.c'
      - '**.cpp'
      - '**.h'
      - '**.hsc'
      - 'Makefile'
      - '.github/workflows/**'
  pull_request:
    branches: [ main ]
    paths:
      - '**.hs'
      - '**.cabal'
      - '**.c'
      - '**.cpp'
      - '**.h'
      - '**.hsc'
      - 'Makefile'
      - '.github/workflows/**'
  workflow_dispatch:

env:
  CABAL_VERSION: "3.10.2.1"
  STACK_VERSION: "2.13.1"
  CCACHE_DIR: /tmp/ccache
  CCACHE_MAXSIZE: 500M
  GHCJOBS: $(nproc)
  CABAL_JOBS: $(nproc)
  MAKE_JOBS: $(nproc)
  CABAL_TEST_JOBS: $(nproc)
  COMMON_DEPENDENCIES: "aeson async attoparsec base bytestring case-insensitive containers deepseq directory exceptions filepath hashable http-client http-conduit http-types lens mtl network optparse-applicative process random scientific stm streaming text time transformers unix unordered-containers vector wai wai-extra warp"

jobs:
  # Ubuntu jobs
  ubuntu-build:
    name: Build (Ubuntu ${{ matrix.ubuntu_version }}, GHC ${{ matrix.ghc }})
    runs-on: ubuntu-${{ matrix.ubuntu_version }}
    timeout-minutes: 60
    env:
      GHC_VERSION: ${{ matrix.ghc }}
      CABAL_BUILD_OPTIONS: "--ghc-options=-j$(nproc) --enable-tests --enable-benchmarks --enable-optimization=2 --disable-library-profiling --enable-executable-stripping --disable-documentation"

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Cache Docker layers
      uses: actions/cache@v4
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-docker-${{ matrix.ubuntu_version }}-${{ matrix.ghc }}-${{ hashFiles(format('.github/workflows/Dockerfile.ubuntu-{0}', matrix.ubuntu_version)) }}
        restore-keys: |
          ${{ runner.os }}-docker-${{ matrix.ubuntu_version }}-${{ matrix.ghc }}-
          ${{ runner.os }}-docker-${{ matrix.ubuntu_version }}-

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: .github/workflows/Dockerfile.ubuntu-${{ matrix.ubuntu_version }}
        push: false
        load: true
        tags: ghcr.io/${{ github.repository }}/ubuntu-${{ matrix.ubuntu_version }}:${{ matrix.ghc }}
        cache-from: type=local,src=/tmp/.buildx-cache
        cache-to: type=local,dest=/tmp/.buildx-cache-new
        build-args: |
          GHC_VERSION=${{ matrix.ghc }}
          CABAL_VERSION=${{ env.CABAL_VERSION }}
          STACK_VERSION=${{ env.STACK_VERSION }}

    - name: Move cache
      run: |
        rm -rf /tmp/.buildx-cache
        mv /tmp/.buildx-cache-new /tmp/.buildx-cache

    - name: Cache Haskell dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cabal/store
          ~/.stack
          dist-newstyle
        key: ${{ runner.os }}-${{ matrix.ubuntu_version }}-deps-${{ matrix.ghc }}-${{ hashFiles('**/*.cabal') }}-${{ hashFiles('cabal.project') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.ubuntu_version }}-deps-${{ matrix.ghc }}-

    - name: Run in Docker container
      run: |
        docker run --rm \
          -v $(pwd):/work \
          -v /tmp/ccache:/tmp/ccache \
          -e GHC_VERSION=${{ matrix.ghc }} \
          -e CABAL_BUILD_OPTIONS="${{ env.CABAL_BUILD_OPTIONS }}" \
          -e CCACHE_DIR=/tmp/ccache \
          -e CCACHE_MAXSIZE=500M \
          -e GHCJOBS=${{ env.GHCJOBS }} \
          -e CABAL_JOBS=${{ env.CABAL_JOBS }} \
          -e MAKE_JOBS=${{ env.MAKE_JOBS }} \
          ghcr.io/${{ github.repository }}/ubuntu-${{ matrix.ubuntu_version }}:${{ matrix.ghc }} \
          bash -c "cabal update && cabal build ${{ env.CABAL_BUILD_OPTIONS }}"

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-ubuntu-${{ matrix.ubuntu_version }}-${{ matrix.ghc }}-${{ matrix.build_type }}
        path: |
          dist-newstyle
          .stack-work
        retention-days: 1
        compression-level: 9

    strategy:
      fail-fast: false
      matrix:
        ubuntu_version: [20.04, 22.04, 24.04]
        ghc: [9.6.6]
        build_type: [release]
        include:
          - ubuntu_version: 22.04
            ghc: 9.4.8
            build_type: test
          - ubuntu_version: 22.04
            ghc: 9.8.4
            build_type: test
          - ubuntu_version: 22.04
            ghc: 9.10.1
            build_type: test
          - ubuntu_version: 22.04
            ghc: 9.12.1
            build_type: test

  # Test jobs for Ubuntu
  ubuntu-test:
    name: Test (Ubuntu ${{ matrix.ubuntu_version }}, GHC ${{ matrix.ghc }})
    needs: ubuntu-build
    runs-on: ubuntu-${{ matrix.ubuntu_version }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        ubuntu_version: [20.04, 22.04, 24.04]
        ghc: [9.6.6]
        build_type: [release]
        include:
          - ubuntu_version: 22.04
            ghc: 9.4.8
            build_type: test
          - ubuntu_version: 22.04
            ghc: 9.8.4
            build_type: test
          - ubuntu_version: 22.04
            ghc: 9.10.1
            build_type: test
          - ubuntu_version: 22.04
            ghc: 9.12.1
            build_type: test

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: build-ubuntu-${{ matrix.ubuntu_version }}-${{ matrix.ghc }}-${{ matrix.build_type }}
        path: .

    - name: Cache GHC
      uses: actions/cache@v4
      id: cache-ghc
      with:
        path: |
          ~/.ghcup
          ~/.cabal/store
          ~/.cabal/packages
        key: ${{ runner.os }}-${{ matrix.ubuntu_version }}-ghc-${{ matrix.ghc }}-${{ hashFiles('**/*.cabal') }}-${{ hashFiles('cabal.project') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.ubuntu_version }}-ghc-${{ matrix.ghc }}-

    - name: Setup GHC
      uses: haskell/actions/setup@v2
      with:
        ghc-version: ${{ matrix.ghc }}
        cabal-version: ${{ env.CABAL_VERSION }}
        stack-version: ${{ env.STACK_VERSION }}
        stack-no-global: true
        stack-setup-ghc: true
        enable-stack: true

    - name: Run smoke tests
      run: |
        cabal test -j${{ env.CABAL_TEST_JOBS }} --test-show-details=direct --test-option=--num-threads=${{ env.CABAL_TEST_JOBS }}

  # HLS jobs for Ubuntu
  ubuntu-hls:
    name: HLS (Ubuntu ${{ matrix.ubuntu_version }}, GHC ${{ matrix.ghc }})
    needs: ubuntu-build
    runs-on: ubuntu-${{ matrix.ubuntu_version }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        ubuntu_version: [20.04, 22.04, 24.04]
        ghc: [9.6.6]
        build_type: [release]
        include:
          - ubuntu_version: 22.04
            ghc: 9.4.8
            build_type: test
          - ubuntu_version: 22.04
            ghc: 9.8.4
            build_type: test
          - ubuntu_version: 22.04
            ghc: 9.10.1
            build_type: test
          - ubuntu_version: 22.04
            ghc: 9.12.1
            build_type: test

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: build-ubuntu-${{ matrix.ubuntu_version }}-${{ matrix.ghc }}-${{ matrix.build_type }}
        path: .

    - name: Cache GHC
      uses: actions/cache@v4
      id: cache-ghc
      with:
        path: |
          ~/.ghcup
          ~/.cabal/store
          ~/.cabal/packages
        key: ${{ runner.os }}-${{ matrix.ubuntu_version }}-ghc-${{ matrix.ghc }}-${{ hashFiles('**/*.cabal') }}-${{ hashFiles('cabal.project') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.ubuntu_version }}-ghc-${{ matrix.ghc }}-

    - name: Setup GHC
      uses: haskell/actions/setup@v2
      with:
        ghc-version: ${{ matrix.ghc }}
        cabal-version: ${{ env.CABAL_VERSION }}
        stack-version: ${{ env.STACK_VERSION }}
        stack-no-global: true
        stack-setup-ghc: true
        enable-stack: true

    - name: Test HLS
      if: matrix.ghc != '9.12.1'
      run: |
        make -j${{ env.MAKE_JOBS }} test-hls

  # GHCI jobs for Ubuntu
  ubuntu-ghci:
    name: GHCI (Ubuntu ${{ matrix.ubuntu_version }}, GHC ${{ matrix.ghc }})
    needs: ubuntu-build
    runs-on: ubuntu-${{ matrix.ubuntu_version }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        ubuntu_version: [20.04, 22.04, 24.04]
        ghc: [9.6.6]
        build_type: [release]
        include:
          - ubuntu_version: 22.04
            ghc: 9.4.8
            build_type: test
          - ubuntu_version: 22.04
            ghc: 9.8.4
            build_type: test
          - ubuntu_version: 22.04
            ghc: 9.10.1
            build_type: test
          - ubuntu_version: 22.04
            ghc: 9.12.1
            build_type: test

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: build-ubuntu-${{ matrix.ubuntu_version }}-${{ matrix.ghc }}-${{ matrix.build_type }}
        path: .

    - name: Cache GHC
      uses: actions/cache@v4
      id: cache-ghc
      with:
        path: |
          ~/.ghcup
          ~/.cabal/store
          ~/.cabal/packages
        key: ${{ runner.os }}-${{ matrix.ubuntu_version }}-ghc-${{ matrix.ghc }}-${{ hashFiles('**/*.cabal') }}-${{ hashFiles('cabal.project') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.ubuntu_version }}-ghc-${{ matrix.ghc }}-

    - name: Setup GHC
      uses: haskell/actions/setup@v2
      with:
        ghc-version: ${{ matrix.ghc }}
        cabal-version: ${{ env.CABAL_VERSION }}
        stack-version: ${{ env.STACK_VERSION }}
        stack-no-global: true
        stack-setup-ghc: true
        enable-stack: true

    - name: Check GHCI load
      run: |
        make -j${{ env.MAKE_JOBS }} test-ghci

  # macOS jobs
  macos-build:
    name: Build (macOS ${{ matrix.macos_version }}, GHC ${{ matrix.ghc }})
    runs-on: macos-${{ matrix.macos_version }}
    timeout-minutes: 60
    env:
      GHC_VERSION: ${{ matrix.ghc }}
    strategy:
      fail-fast: false
      matrix:
        macos_version: [13, 14, 15]
        ghc: [9.6.6]
        build_type: [release]
        include:
          - macos_version: 14
            ghc: 9.4.8
            build_type: test
          - macos_version: 14
            ghc: 9.8.4
            build_type: test
          - macos_version: 14
            ghc: 9.10.1
            build_type: test
          - macos_version: 14
            ghc: 9.12.1
            build_type: test

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Cache GHC
      uses: actions/cache@v4
      id: cache-ghc
      with:
        path: |
          ~/.ghcup
          ~/.cabal/store
          ~/.cabal/packages
        key: macos-${{ matrix.macos_version }}-ghc-${{ matrix.ghc }}-${{ hashFiles('**/*.cabal') }}-${{ hashFiles('cabal.project') }}
        restore-keys: |
          macos-${{ matrix.macos_version }}-ghc-${{ matrix.ghc }}-

    - name: Cache build artifacts
      uses: actions/cache@v4
      id: cache-build
      with:
        path: |
          dist-newstyle
          .stack-work
        key: macos-${{ matrix.macos_version }}-build-${{ matrix.ghc }}-${{ hashFiles('**/*.hs', '**/*.cabal', '**/*.hsc', '**/*.h', '**/*.c', '**/*.cpp') }}
        restore-keys: |
          macos-${{ matrix.macos_version }}-build-${{ matrix.ghc }}-

    - name: Cache ccache
      uses: actions/cache@v4
      id: cache-ccache
      with:
        path: /tmp/ccache
        key: macos-${{ matrix.macos_version }}-ccache-${{ matrix.ghc }}-${{ hashFiles('**/*.c', '**/*.cpp', '**/*.h') }}
        restore-keys: |
          macos-${{ matrix.macos_version }}-ccache-${{ matrix.ghc }}-

    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: macos-${{ matrix.macos_version }}-ccache-${{ matrix.ghc }}
        max-size: 500M

    - name: Install system dependencies
      run: |
        brew update
        brew install gmp z3

    - name: Setup GHC
      uses: haskell/actions/setup@v2
      with:
        ghc-version: ${{ matrix.ghc }}
        cabal-version: ${{ env.CABAL_VERSION }}
        stack-version: ${{ env.STACK_VERSION }}
        stack-no-global: true
        stack-setup-ghc: true
        enable-stack: true

    - name: Cache Haskell dependencies
      uses: actions/cache@v4
      id: cache-deps
      with:
        path: |
          ~/.cabal/store
          ~/.stack
          dist-newstyle
        key: macos-${{ matrix.macos_version }}-deps-${{ matrix.ghc }}-${{ hashFiles('**/*.cabal') }}-${{ hashFiles('cabal.project') }}
        restore-keys: |
          macos-${{ matrix.macos_version }}-deps-${{ matrix.ghc }}-

    - name: Install Haskell dependencies
      run: |
        cabal update
        cabal build --only-dependencies -j${{ env.CABAL_JOBS }}

    - name: Build
      run: |
        make -j${{ env.MAKE_JOBS }} GHCJOBS=${{ env.GHCJOBS }} CABAL_JOBS=${{ env.CABAL_JOBS }}

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-macos-${{ matrix.macos_version }}-${{ matrix.ghc }}-${{ matrix.build_type }}
        path: |
          dist-newstyle
          .stack-work
        retention-days: 1
        compression-level: 9

  # Test jobs for macOS
  macos-test:
    name: Test (macOS ${{ matrix.macos_version }}, GHC ${{ matrix.ghc }})
    needs: macos-build
    runs-on: macos-${{ matrix.macos_version }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        macos_version: [13, 14, 15]
        ghc: [9.6.6]
        build_type: [release]
        include:
          - macos_version: 14
            ghc: 9.4.8
            build_type: test
          - macos_version: 14
            ghc: 9.8.4
            build_type: test
          - macos_version: 14
            ghc: 9.10.1
            build_type: test
          - macos_version: 14
            ghc: 9.12.1
            build_type: test

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: build-macos-${{ matrix.macos_version }}-${{ matrix.ghc }}-${{ matrix.build_type }}
        path: .

    - name: Cache GHC
      uses: actions/cache@v4
      id: cache-ghc
      with:
        path: |
          ~/.ghcup
          ~/.cabal/store
          ~/.cabal/packages
        key: macos-${{ matrix.macos_version }}-ghc-${{ matrix.ghc }}-${{ hashFiles('**/*.cabal') }}-${{ hashFiles('cabal.project') }}
        restore-keys: |
          macos-${{ matrix.macos_version }}-ghc-${{ matrix.ghc }}-

    - name: Setup GHC
      uses: haskell/actions/setup@v2
      with:
        ghc-version: ${{ matrix.ghc }}
        cabal-version: ${{ env.CABAL_VERSION }}
        stack-version: ${{ env.STACK_VERSION }}
        stack-no-global: true
        stack-setup-ghc: true
        enable-stack: true

    - name: Run smoke tests
      run: |
        make -j${{ env.MAKE_JOBS }} smoke-tests

  # HLS jobs for macOS
  macos-hls:
    name: HLS (macOS ${{ matrix.macos_version }}, GHC ${{ matrix.ghc }})
    needs: macos-build
    runs-on: macos-${{ matrix.macos_version }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        macos_version: [13, 14, 15]
        ghc: [9.6.6]
        build_type: [release]
        include:
          - macos_version: 14
            ghc: 9.4.8
            build_type: test
          - macos_version: 14
            ghc: 9.8.4
            build_type: test
          - macos_version: 14
            ghc: 9.10.1
            build_type: test
          - macos_version: 14
            ghc: 9.12.1
            build_type: test

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: build-macos-${{ matrix.macos_version }}-${{ matrix.ghc }}-${{ matrix.build_type }}
        path: .

    - name: Cache GHC
      uses: actions/cache@v4
      id: cache-ghc
      with:
        path: |
          ~/.ghcup
          ~/.cabal/store
          ~/.cabal/packages
        key: macos-${{ matrix.macos_version }}-ghc-${{ matrix.ghc }}-${{ hashFiles('**/*.cabal') }}-${{ hashFiles('cabal.project') }}
        restore-keys: |
          macos-${{ matrix.macos_version }}-ghc-${{ matrix.ghc }}-

    - name: Setup GHC
      uses: haskell/actions/setup@v2
      with:
        ghc-version: ${{ matrix.ghc }}
        cabal-version: ${{ env.CABAL_VERSION }}
        stack-version: ${{ env.STACK_VERSION }}
        stack-no-global: true
        stack-setup-ghc: true
        enable-stack: true

    - name: Test HLS
      if: matrix.ghc != '9.12.1'
      run: |
        make -j${{ env.MAKE_JOBS }} test-hls

  # GHCI jobs for macOS
  macos-ghci:
    name: GHCI (macOS ${{ matrix.macos_version }}, GHC ${{ matrix.ghc }})
    needs: macos-build
    runs-on: macos-${{ matrix.macos_version }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        macos_version: [13, 14, 15]
        ghc: [9.6.6]
        build_type: [release]
        include:
          - macos_version: 14
            ghc: 9.4.8
            build_type: test
          - macos_version: 14
            ghc: 9.8.4
            build_type: test
          - macos_version: 14
            ghc: 9.10.1
            build_type: test
          - macos_version: 14
            ghc: 9.12.1
            build_type: test

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: build-macos-${{ matrix.macos_version }}-${{ matrix.ghc }}-${{ matrix.build_type }}
        path: .

    - name: Cache GHC
      uses: actions/cache@v4
      id: cache-ghc
      with:
        path: |
          ~/.ghcup
          ~/.cabal/store
          ~/.cabal/packages
        key: macos-${{ matrix.macos_version }}-ghc-${{ matrix.ghc }}-${{ hashFiles('**/*.cabal') }}-${{ hashFiles('cabal.project') }}
        restore-keys: |
          macos-${{ matrix.macos_version }}-ghc-${{ matrix.ghc }}-

    - name: Setup GHC
      uses: haskell/actions/setup@v2
      with:
        ghc-version: ${{ matrix.ghc }}
        cabal-version: ${{ env.CABAL_VERSION }}
        stack-version: ${{ env.STACK_VERSION }}
        stack-no-global: true
        stack-setup-ghc: true
        enable-stack: true

    - name: Check GHCI load
      run: |
        make -j${{ env.MAKE_JOBS }} test-ghci

    - name: Create cabal.project
      run: |
        cat > cabal.project << EOF
        packages: .
        tests: True
        benchmarks: True
        optimization: 2
        documentation: False
        tests-show-details: direct
        tests-show-log: True
        tests-keep-tix: True
        tests-keep-going: True
        tests-jobs: ${{ env.CABAL_TEST_JOBS }}
        EOF 