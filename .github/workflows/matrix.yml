name: Matrix Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allow manual triggering

jobs:
  matrix-build:
    strategy:
      fail-fast: false  # Continue with other jobs if one fails
      matrix:
        include:
          # Release builds - most stable GHC version
          - os: ubuntu-20.04
            ghc: 9.6.6
            build_type: release
            hls: 2.9.0.1
          - os: ubuntu-22.04
            ghc: 9.6.6
            build_type: release
            hls: 2.9.0.1
          - os: ubuntu-24.04
            ghc: 9.6.6
            build_type: release
            hls: 2.9.0.1
          - os: macos-13
            ghc: 9.6.6
            build_type: release
            hls: 2.9.0.1
          - os: macos-14
            ghc: 9.6.6
            build_type: release
            hls: 2.9.0.1
          - os: macos-15
            ghc: 9.6.6
            build_type: release
            hls: 2.9.0.1

          # Test builds - newer GHC versions on selected platforms
          - os: ubuntu-22.04
            ghc: 9.4.8
            build_type: test
            hls: 2.9.0.1
          - os: ubuntu-22.04
            ghc: 9.8.4
            build_type: test
            hls: ""
          - os: ubuntu-22.04
            ghc: 9.10.1
            build_type: test
            hls: 2.9.0.1
          - os: ubuntu-22.04
            ghc: 9.12.1
            build_type: test
            hls: ""
          - os: macos-14
            ghc: 9.4.8
            build_type: test
            hls: 2.9.0.1
          - os: macos-14
            ghc: 9.8.4
            build_type: test
            hls: ""
          - os: macos-14
            ghc: 9.10.1
            build_type: test
            hls: 2.9.0.1
          - os: macos-14
            ghc: 9.12.1
            build_type: test
            hls: ""

    name: ${{ matrix.os }} / ghc-${{ matrix.ghc }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for versioning

      - name: Cache GHC and Cabal
        uses: actions/cache@v4
        with:
          path: |
            ~/.ghcup
            ~/.cabal
          key: ${{ runner.os }}-ghc-${{ matrix.ghc }}-cabal-${{ hashFiles('**/*.cabal') }}
          restore-keys: |
            ${{ runner.os }}-ghc-${{ matrix.ghc }}-cabal-
            ${{ runner.os }}-ghc-${{ matrix.ghc }}-

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: |
            dist-newstyle
            .ghc.environment.*
          key: ${{ runner.os }}-ghc-${{ matrix.ghc }}-build-${{ hashFiles('**/*.hs') }}
          restore-keys: |
            ${{ runner.os }}-ghc-${{ matrix.ghc }}-build-
            ${{ runner.os }}-ghc-${{ matrix.ghc }}-

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/ccache
          key: ${{ runner.os }}-ccache-${{ matrix.ghc }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ matrix.ghc }}-
            ${{ runner.os }}-ccache-

      - name: Setup ccache
        run: |
          mkdir -p ccache
          echo "CCACHE_DIR=${{ github.workspace }}/ccache" >> $GITHUB_ENV
          echo "CCACHE_MAXSIZE=500M" >> $GITHUB_ENV

      - name: Install system dependencies (Ubuntu)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo .github/workflows/install_dependencies_ubuntu.sh

      - name: Install system dependencies (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          .github/workflows/install_dependencies_macos.sh

      - name: Setup GHC
        run: |
          # If ghcup isn't installed, install it
          if ! command -v ghcup &> /dev/null; then
            if [ "${{ runner.os }}" = "macOS" ]; then
              curl --proto '=https' --tlsv1.2 -sSf https://get-ghcup.haskell.org | sh
              echo "$HOME/.ghcup/bin" >> $GITHUB_PATH
            else
              export BOOTSTRAP_HASKELL_NONINTERACTIVE=1
              curl --proto '=https' --tlsv1.2 -sSf https://get-ghcup.haskell.org | sh
            fi
          fi
          
          ghcup install ghc ${{ matrix.ghc }}
          ghcup set ghc ${{ matrix.ghc }}

      - name: Install Haskell dependencies
        run: |
          cabal update
          cabal v1-install old-time regex-compat split syb

      - name: Build
        env:
          CCACHE_DIR: ${{ github.workspace }}/ccache
        run: |
          ccache --zero-stats --max-size 500M
          export PATH=/usr/lib/ccache:$PATH
          make -j3 GHCJOBS=2 GHCRTSFLAGS='+RTS -M5G -A128m -RTS' install-src
          tar czf inst.tar.gz inst

      - name: Run smoke tests
        run: make check-smoke

      - name: Test Haskell Language Server
        if: matrix.hls != ''
        run: |
          ghcup install hls ${{ matrix.hls }}
          if [ "${{ startsWith(matrix.os, 'ubuntu') }}" = "true" ]; then
            ubuntu_ver=$(lsb_release -rs | cut -d '.' -f 1)
            if [ "$ubuntu_ver" -ge "24" ]; then
              sudo apt-get update
              sudo apt-get install -y python3-yaml
            else
              pip3 install pyyaml
            fi
          else
            pip3 install pyyaml
          fi
          python3 util/haskell-language-server/gen_hie.py
          cd src/comp
          haskell-language-server-${{ matrix.ghc }} bsc.hs

      - name: Check GHCI load
        run: |
          cd src/comp
          export NOGIT=0
          export NOUPDATEBUILDVERSION=0
          ./update-build-version.sh
          ./update-build-system.sh
          echo ':load bsc.hs' | ghci 2>&1 | tee ghci.log
          if grep -E '(Failed|error:)' ghci.log; then
            echo "GHCi reported errors."
            exit 1
          fi

      - name: Upload build artifacts
        if: matrix.build_type == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: bsc-${{ matrix.os }}-ghc${{ matrix.ghc }}
          path: inst.tar.gz
          retention-days: 7 