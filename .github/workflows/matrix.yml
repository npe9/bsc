name: Matrix Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  CABAL_VERSION: "3.10.2.1"
  STACK_VERSION: "2.13.1"
  CCACHE_DIR: /tmp/ccache
  CCACHE_MAXSIZE: 500M
  GHCJOBS: $(nproc)
  CABAL_JOBS: $(nproc)
  MAKE_JOBS: $(nproc)

jobs:
  build:
    name: Build (${{ matrix.os }}, GHC ${{ matrix.ghc }}, ${{ matrix.build_type }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      GHC_VERSION: ${{ matrix.ghc }}
    strategy:
      matrix:
        os: [ubuntu-20.04, ubuntu-22.04, ubuntu-24.04, macos-13, macos-14, macos-15]
        ghc: [9.6.6]
        build_type: [release]
        include:
          - os: ubuntu-22.04
            ghc: 9.4.8
            build_type: test
          - os: ubuntu-22.04
            ghc: 9.8.4
            build_type: test
          - os: ubuntu-22.04
            ghc: 9.10.1
            build_type: test
          - os: ubuntu-22.04
            ghc: 9.12.1
            build_type: test
          - os: macos-14
            ghc: 9.4.8
            build_type: test
          - os: macos-14
            ghc: 9.8.4
            build_type: test
          - os: macos-14
            ghc: 9.10.1
            build_type: test
          - os: macos-14
            ghc: 9.12.1
            build_type: test

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Cache GHC
      uses: actions/cache@v4
      id: cache-ghc
      with:
        path: |
          ~/.ghcup
          ~/.cabal/store
          ~/.cabal/packages
        key: ${{ runner.os }}-ghc-${{ matrix.ghc }}-${{ hashFiles('**/*.cabal') }}

    - name: Cache build artifacts
      uses: actions/cache@v4
      id: cache-build
      with:
        path: |
          dist-newstyle
          .stack-work
        key: ${{ runner.os }}-build-${{ matrix.ghc }}-${{ hashFiles('**/*.hs', '**/*.cabal', '**/*.hsc', '**/*.h', '**/*.c', '**/*.cpp') }}

    - name: Cache ccache
      uses: actions/cache@v4
      id: cache-ccache
      with:
        path: /tmp/ccache
        key: ${{ runner.os }}-ccache-${{ matrix.ghc }}-${{ hashFiles('**/*.c', '**/*.cpp', '**/*.h') }}

    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ${{ runner.os }}-ccache-${{ matrix.ghc }}
        max-size: 500M

    - name: Install system dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          curl \
          libffi-dev \
          libffi8ubuntu1 \
          libgmp-dev \
          libgmp10 \
          libncurses-dev \
          libncurses5 \
          libtinfo5 \
          libz3-dev \
          zlib1g-dev \
          libghc-split-dev

    - name: Install system dependencies
      if: runner.os == 'macOS'
      run: |
        brew update
        brew install gmp z3

    - name: Setup GHC
      uses: haskell/actions/setup@v2
      with:
        ghc-version: ${{ matrix.ghc }}
        cabal-version: ${{ env.CABAL_VERSION }}
        stack-version: ${{ env.STACK_VERSION }}
        stack-no-global: true
        stack-setup-ghc: true
        enable-stack: true

    - name: Cache Haskell dependencies
      uses: actions/cache@v4
      id: cache-deps
      with:
        path: |
          ~/.cabal/store
          ~/.stack
          dist-newstyle
        key: ${{ runner.os }}-deps-${{ matrix.ghc }}-${{ hashFiles('**/*.cabal') }}

    - name: Install Haskell dependencies
      run: |
        cabal update
        cabal build --only-dependencies -j${{ env.CABAL_JOBS }}

    - name: Build
      run: |
        make -j${{ env.MAKE_JOBS }} GHCJOBS=${{ env.GHCJOBS }} CABAL_JOBS=${{ env.CABAL_JOBS }}

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-${{ matrix.os }}-${{ matrix.ghc }}-${{ matrix.build_type }}
        path: |
          dist-newstyle
          .stack-work
        retention-days: 1

  test:
    name: Test (${{ matrix.os }}, GHC ${{ matrix.ghc }}, ${{ matrix.build_type }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-20.04, ubuntu-22.04, ubuntu-24.04, macos-13, macos-14, macos-15]
        ghc: [9.6.6]
        build_type: [release]
        include:
          - os: ubuntu-22.04
            ghc: 9.4.8
            build_type: test
          - os: ubuntu-22.04
            ghc: 9.8.4
            build_type: test
          - os: ubuntu-22.04
            ghc: 9.10.1
            build_type: test
          - os: ubuntu-22.04
            ghc: 9.12.1
            build_type: test
          - os: macos-14
            ghc: 9.4.8
            build_type: test
          - os: macos-14
            ghc: 9.8.4
            build_type: test
          - os: macos-14
            ghc: 9.10.1
            build_type: test
          - os: macos-14
            ghc: 9.12.1
            build_type: test

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: build-${{ matrix.os }}-${{ matrix.ghc }}-${{ matrix.build_type }}
        path: .

    - name: Cache GHC
      uses: actions/cache@v4
      id: cache-ghc
      with:
        path: |
          ~/.ghcup
          ~/.cabal/store
          ~/.cabal/packages
        key: ${{ runner.os }}-ghc-${{ matrix.ghc }}-${{ hashFiles('**/*.cabal') }}

    - name: Setup GHC
      uses: haskell/actions/setup@v2
      with:
        ghc-version: ${{ matrix.ghc }}
        cabal-version: ${{ env.CABAL_VERSION }}
        stack-version: ${{ env.STACK_VERSION }}
        stack-no-global: true
        stack-setup-ghc: true
        enable-stack: true

    - name: Run smoke tests
      run: |
        make -j${{ env.MAKE_JOBS }} smoke-tests

  hls:
    name: HLS (${{ matrix.os }}, GHC ${{ matrix.ghc }}, ${{ matrix.build_type }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      matrix:
        os: [ubuntu-20.04, ubuntu-22.04, ubuntu-24.04, macos-13, macos-14, macos-15]
        ghc: [9.6.6]
        build_type: [release]
        include:
          - os: ubuntu-22.04
            ghc: 9.4.8
            build_type: test
          - os: ubuntu-22.04
            ghc: 9.8.4
            build_type: test
          - os: ubuntu-22.04
            ghc: 9.10.1
            build_type: test
          - os: ubuntu-22.04
            ghc: 9.12.1
            build_type: test
          - os: macos-14
            ghc: 9.4.8
            build_type: test
          - os: macos-14
            ghc: 9.8.4
            build_type: test
          - os: macos-14
            ghc: 9.10.1
            build_type: test
          - os: macos-14
            ghc: 9.12.1
            build_type: test

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: build-${{ matrix.os }}-${{ matrix.ghc }}-${{ matrix.build_type }}
        path: .

    - name: Cache GHC
      uses: actions/cache@v4
      id: cache-ghc
      with:
        path: |
          ~/.ghcup
          ~/.cabal/store
          ~/.cabal/packages
        key: ${{ runner.os }}-ghc-${{ matrix.ghc }}-${{ hashFiles('**/*.cabal') }}

    - name: Setup GHC
      uses: haskell/actions/setup@v2
      with:
        ghc-version: ${{ matrix.ghc }}
        cabal-version: ${{ env.CABAL_VERSION }}
        stack-version: ${{ env.STACK_VERSION }}
        stack-no-global: true
        stack-setup-ghc: true
        enable-stack: true

    - name: Test HLS
      if: matrix.ghc != '9.12.1'
      run: |
        make -j${{ env.MAKE_JOBS }} test-hls

  ghci:
    name: GHCI (${{ matrix.os }}, GHC ${{ matrix.ghc }}, ${{ matrix.build_type }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      matrix:
        os: [ubuntu-20.04, ubuntu-22.04, ubuntu-24.04, macos-13, macos-14, macos-15]
        ghc: [9.6.6]
        build_type: [release]
        include:
          - os: ubuntu-22.04
            ghc: 9.4.8
            build_type: test
          - os: ubuntu-22.04
            ghc: 9.8.4
            build_type: test
          - os: ubuntu-22.04
            ghc: 9.10.1
            build_type: test
          - os: ubuntu-22.04
            ghc: 9.12.1
            build_type: test
          - os: macos-14
            ghc: 9.4.8
            build_type: test
          - os: macos-14
            ghc: 9.8.4
            build_type: test
          - os: macos-14
            ghc: 9.10.1
            build_type: test
          - os: macos-14
            ghc: 9.12.1
            build_type: test

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: build-${{ matrix.os }}-${{ matrix.ghc }}-${{ matrix.build_type }}
        path: .

    - name: Cache GHC
      uses: actions/cache@v4
      id: cache-ghc
      with:
        path: |
          ~/.ghcup
          ~/.cabal/store
          ~/.cabal/packages
        key: ${{ runner.os }}-ghc-${{ matrix.ghc }}-${{ hashFiles('**/*.cabal') }}

    - name: Setup GHC
      uses: haskell/actions/setup@v2
      with:
        ghc-version: ${{ matrix.ghc }}
        cabal-version: ${{ env.CABAL_VERSION }}
        stack-version: ${{ env.STACK_VERSION }}
        stack-no-global: true
        stack-setup-ghc: true
        enable-stack: true

    - name: Check GHCI load
      run: |
        make -j${{ env.MAKE_JOBS }} test-ghci 