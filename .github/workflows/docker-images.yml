name: Build Docker Images

on:
  push:
    branches: [ main ]
    paths:
      - 'docker/**'
      - '.github/workflows/docker-images.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      caller_workflow:
        description: 'Name of the workflow calling this one'
        required: false
        type: string
        default: 'direct'
    secrets:
      token:
        description: 'GitHub token'
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build-base-images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ubuntu: ['22.04', '24.04']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.token }}

      - name: Build and push base image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/base/ubuntu-${{ matrix.ubuntu }}.Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}-base:ubuntu-${{ matrix.ubuntu }}
          cache-from: type=gha,scope=base-${{ matrix.ubuntu }}
          cache-to: type=gha,mode=max,scope=base-${{ matrix.ubuntu }}
          provenance: false

  build-bsc-images:
    needs: build-base-images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ubuntu: ['22.04', '24.04']
        ghc:
          - version: '9.4.8'
            hls: '2.10.0.0'
          - version: '9.6.7'
            hls: '2.10.0.0'
          - version: '9.8.4'
            hls: '2.10.0.0'
          - version: '9.10.1'
            hls: '2.10.0.0'
          - version: '9.12.2'
            hls: '2.10.0.0'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.token }}

      - name: Build BSC image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/builder/Dockerfile.template
          push: true
          tags: ghcr.io/${{ github.repository }}:ubuntu-${{ matrix.ubuntu }}-ghc-${{ matrix.ghc.version }}
          build-args: |
            UBUNTU_VERSION=${{ matrix.ubuntu }}
            GHC_VERSION=${{ matrix.ghc.version }}
            HLS_VERSION=${{ matrix.ghc.hls }}
            BASE_IMAGE=ghcr.io/${{ github.repository }}-base:ubuntu-${{ matrix.ubuntu }}
          cache-from: |
            type=gha,scope=bsc-${{ matrix.ubuntu }}-${{ matrix.ghc.version }}
            ghcr.io/${{ github.repository }}-base:ubuntu-${{ matrix.ubuntu }}
          cache-to: type=gha,mode=max,scope=bsc-${{ matrix.ubuntu }}-${{ matrix.ghc.version }}
          provenance: false 