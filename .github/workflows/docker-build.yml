name: Build and Push Docker Images

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DOCKER_BUILDKIT: 1

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ubuntu: ['22.04', '24.04']
        ghc:
          - version: '9.4.8'
            hls: '2.10.0.0'
          - version: '9.6.7'
            hls: '2.10.0.0'
          - version: '9.8.4'
            hls: '2.10.0.0'
          - version: '9.10.1'
            hls: '2.10.0.0'
          - version: '9.12.2'
            hls: '2.10.0.0'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and push base image first
      - name: Build and push base image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/base/ubuntu-${{ matrix.ubuntu }}.Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-base:ubuntu-${{ matrix.ubuntu }}
          cache-from: type=gha,scope=base-${{ matrix.ubuntu }}
          cache-to: type=gha,mode=max,scope=base-${{ matrix.ubuntu }}
          platforms: linux/amd64
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=BSC base image for Ubuntu ${{ matrix.ubuntu }}

      # Build BSC image using the base
      - name: Build and push BSC image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/builder/Dockerfile.template
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ubuntu-${{ matrix.ubuntu }}-ghc-${{ matrix.ghc.version }}
            ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && format('{0}/{1}:latest', env.REGISTRY, env.IMAGE_NAME) || '' }}
          build-args: |
            UBUNTU_VERSION=${{ matrix.ubuntu }}
            GHC_VERSION=${{ matrix.ghc.version }}
            HLS_VERSION=${{ matrix.ghc.hls }}
            BASE_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-base:ubuntu-${{ matrix.ubuntu }}
          cache-from: |
            type=gha,scope=bsc-${{ matrix.ubuntu }}-${{ matrix.ghc.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-base:ubuntu-${{ matrix.ubuntu }}
          cache-to: type=gha,mode=max,scope=bsc-${{ matrix.ubuntu }}-${{ matrix.ghc.version }}
          platforms: linux/amd64
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=BSC with GHC ${{ matrix.ghc.version }} on Ubuntu ${{ matrix.ubuntu }} 