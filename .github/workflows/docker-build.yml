name: Build Docker Images

on:
  push:
    branches: [ main, fix/* ]
    paths:
      - 'docker/**'
      - '.github/workflows/docker-build.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'docker/**'
      - '.github/workflows/docker-build.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DOCKER_BUILDKIT: 1

jobs:
  # Build the dependency layer first - this contains all system dependencies
  build-deps:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ubuntu: ['22.04', '24.04']
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push deps layer
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/deps/ubuntu-${{ matrix.ubuntu }}.Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-deps:ubuntu-${{ matrix.ubuntu }}
          cache-from: |
            type=gha,scope=deps-${{ matrix.ubuntu }}
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-deps:ubuntu-${{ matrix.ubuntu }}
          cache-to: type=gha,mode=max,scope=deps-${{ matrix.ubuntu }}
          platforms: linux/amd64
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=BSC dependencies for Ubuntu ${{ matrix.ubuntu }}

  # Build the tools layer - this contains STP and Yices
  build-tools:
    needs: build-deps
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ubuntu: ['22.04', '24.04']
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push tools layer
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/tools/ubuntu-${{ matrix.ubuntu }}.Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-tools:ubuntu-${{ matrix.ubuntu }}
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-deps:ubuntu-${{ matrix.ubuntu }}
          cache-from: |
            type=gha,scope=tools-${{ matrix.ubuntu }}
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-tools:ubuntu-${{ matrix.ubuntu }}
          cache-to: type=gha,mode=max,scope=tools-${{ matrix.ubuntu }}
          platforms: linux/amd64
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=BSC tools for Ubuntu ${{ matrix.ubuntu }}

  # Build the GHC layer - this contains GHC and Haskell tools
  build-ghc:
    needs: build-tools
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ubuntu: ['22.04', '24.04']
        ghc:
          - version: '9.4.8'
            hls: '2.10.0.0'
          - version: '9.6.7'
            hls: '2.10.0.0'
          - version: '9.8.4'
            hls: '2.10.0.0'
          - version: '9.10.1'
            hls: '2.10.0.0'
          - version: '9.12.2'
            hls: '2.10.0.0'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push GHC layer
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/ghc/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-ghc:ubuntu-${{ matrix.ubuntu }}-${{ matrix.ghc.version }}
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-tools:ubuntu-${{ matrix.ubuntu }}
            GHC_VERSION=${{ matrix.ghc.version }}
            HLS_VERSION=${{ matrix.ghc.hls }}
          cache-from: |
            type=gha,scope=ghc-${{ matrix.ubuntu }}-${{ matrix.ghc.version }}
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-ghc:ubuntu-${{ matrix.ubuntu }}-${{ matrix.ghc.version }}
          cache-to: type=gha,mode=max,scope=ghc-${{ matrix.ubuntu }}-${{ matrix.ghc.version }}
          platforms: linux/amd64
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=BSC GHC ${{ matrix.ghc.version }} for Ubuntu ${{ matrix.ubuntu }} 