name: Bluespec
on:
push:
branches:[main]
pull_request:
branches:[main]

jobs:
bluespec-build:
needs:build
runs-on:ubuntu-latest
steps:
-uses:actions/checkout@v4

-name:SetupGHC
uses:haskell/actions/setup@v2
with:
ghc-version:'9.8.1'
cabal-version:'3.10.1.0'

-name:Cachedependencies
uses:actions/cache@v4
with:
path:|
~/.cabal/packages
~/.cabal/store
dist-newstyle
key:${{runner.os}}-ghc-9.8.1-${{hashFiles('**/*.cabal','cabal.project')}}
restore-keys:|
${{runner.os}}-ghc-9.8.1-

-name:BuildBSCcompiler
run:|
cabalupdate
cabalbuild

-name:SetupBluespec
run:|
#InstallBluespeccompileranddependencies
sudoapt-getupdate
sudoapt-getinstall-ybuild-essentialgit

-name:CacheBluespecartifacts
uses:actions/cache@v4
with:
path:|
build/bsvlib
build/tcllib
build/sim
build/verilog
build/info
key:${{runner.os}}-bluespec-${{hashFiles('**/*.bs','**/*.bsv')}}
restore-keys:|
${{runner.os}}-bluespec-

-name:BuildBluespeclibraries
run:|
mkdir-pbuild/{bsvlib,tcllib,sim,verilog,info}
dist-newstyle/build/*/*/*/bsc-*/b/build/bsc/bsc-bdirbuild/bsvlib-vdirbuild/verilog-simdirbuild/sim-info-dirbuild/info$(find.-name"*.bs"-o-name"*.bsv")

-name:RunBluespectests
run:|
mkdir-pbuild/test
dist-newstyle/build/*/*/*/bsc-*/b/build/bsc/bsc-sim-simdirbuild/sim-bdirbuild/bsvlib-vdirbuild/verilog-info-dirbuild/info-obuild/test/test$(find.-name"*_test.bs"-o-name"*_test.bsv")
./build/test/test

-name:GenerateBluespecdocumentation
run:|
mkdir-pbuild/doc/bluespec
dist-newstyle/build/*/*/*/bsc-*/b/build/bsc/bsc-doc-bdirbuild/bsvlib-vdirbuild/verilog-simdirbuild/sim-info-dirbuild/info$(find.-name"*.bs"-o-name"*.bsv")

-name:RunBluespecbenchmarks
run:|
mkdir-pbuild/bench
dist-newstyle/build/*/*/*/bsc-*/b/build/bsc/bsc-sim-simdirbuild/sim-bdirbuild/bsvlib-vdirbuild/verilog-info-dirbuild/info-obuild/bench/bench$(find.-name"*_bench.bs"-o-name"*_bench.bsv")
./build/bench/bench

-name:UploadBluespecartifacts
uses:actions/upload-artifact@v4
with:
name:bluespec-artifacts
path:|
build/bsvlib/
build/tcllib/
build/sim/
build/verilog/
build/info/
build/doc/bluespec/
build/bench/*.vcd
build/bench/*.log
build/test/*.log

bluespec-synthesis:
needs:build
runs-on:ubuntu-latest
steps:
-uses:actions/checkout@v4

-name:SetupGHC
uses:haskell/actions/setup@v2
with:
ghc-version:'9.8.1'
cabal-version:'3.10.1.0'

-name:Cachedependencies
uses:actions/cache@v4
with:
path:|
~/.cabal/packages
~/.cabal/store
dist-newstyle
key:${{runner.os}}-ghc-9.8.1-${{hashFiles('**/*.cabal','cabal.project')}}
restore-keys:|
${{runner.os}}-ghc-9.8.1-

-name:BuildBSCcompiler
run:|
cabalupdate
cabalbuild

-name:SetupBluespec
run:|
#InstallBluespeccompilerandsynthesistools
sudoapt-getupdate
sudoapt-getinstall-ybuild-essentialgit

-name:CacheBluespecartifacts
uses:actions/cache@v4
with:
path:|
build/bsvlib
build/tcllib
build/sim
build/verilog
build/info
key:${{runner.os}}-bluespec-${{hashFiles('**/*.bs','**/*.bsv')}}
restore-keys:|
${{runner.os}}-bluespec-

-name:SynthesizetoVerilog
run:|
mkdir-pbuild/synth
dist-newstyle/build/*/*/*/bsc-*/b/build/bsc/bsc-verilog-bdirbuild/bsvlib-vdirbuild/verilog-simdirbuild/sim-info-dirbuild/info-obuild/synth/synth$(find.-name"*.bs"-o-name"*.bsv")

-name:CheckVerilogsynthesis
run:|
#AddyourpreferredVeriloglinting/synthesistoolhere
#Forexample:verilator,yosys,etc.
echo"Verilogsynthesischeckplaceholder"

-name:Uploadsynthesisartifacts
uses:actions/upload-artifact@v4
with:
name:synthesis-artifacts
path:build/synth/